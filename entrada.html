<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 20px; }
  .entrada { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; }
  .entrada-logo { height: 54px; display: block; margin: 0 auto 14px; }
  .entrada-sub { margin: 0 0 40px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); text-align: center; }
  .menu { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .menu a {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 24px; text-decoration: none;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px;
    color: var(--text); transition: border-color .15s, transform .15s;
  }
  .menu a:hover { border-color: var(--gold); transform: translateY(-1px); }
  .menu a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .menu .titulo { display: block; font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.1; }
  .menu .desc { display: block; margin-top: 4px; font-size: 13.5px; color: var(--text-secondary); }
  .menu .seta { color: var(--gold); font-size: 20px; flex: none; }
  @media (max-width: 480px) { .menu a { padding: 18px 18px; } .menu .titulo { font-size: 25px; } }
</style>
