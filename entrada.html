<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielvogel Joias — Painel Interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .entrada {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .entrada-logo { max-width: 320px; width: 100%; height: auto; margin-bottom: 28px; }
  .entrada-boas-vindas {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--text);
    margin: 0 0 6px;
    font-weight: 500;
  }
  .entrada-sub {
    font-size: 14px;
    color: var(--text-secondary);
    margin: 0 0 36px;
  }
  .entrada-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .entrada-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
  }
  .entrada-item:hover { border-color: var(--gold); background: var(--bg-elevated-2); }
  .entrada-item-nome {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--text);
  }
  .entrada-item-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .entrada-item-seta { color: var(--gold); font-size: 18px; flex-shrink: 0; }
  .entrada-rodape {
    margin-top: 36px;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="entrada">
  <img class="entrada-logo" src="logo.png" alt="Spielvogel Joias">
  <p class="entrada-boas-vindas">Bem-vindo ao painel interno</p>
  <p class="entrada-sub">Escolha uma ferramenta para começar</p>

  <div class="entrada-menu">
    <a class="entrada-item" href="leads.html">
      <div>
        <div class="entrada-item-nome">Leads</div>
        <div class="entrada-item-desc">Acompanhamento de contatos e vendas em andamento</div>
      </div>
      <span class="entrada-item-seta">→</span>
    </a>
    <a class="entrada-item" href="index.html">
      <div>
        <div class="entrada-item-nome">Painel de Encomendas</div>
        <div class="entrada-item-desc">Pedidos em produção, do aprovado à entrega</div>
      </div>
      <span class="entrada-item-seta">→</span>
    </a>
    <a class="entrada-item" href="tabela-precos.html">
      <div>
        <div class="entrada-item-nome">Tabela de Preços</div>
        <div class="entrada-item-desc">Modelos, pedras e valores de referência</div>
      </div>
      <span class="entrada-item-seta">→</span>
    </a>
  </div>

  <p class="entrada-rodape">Spielvogel Joias</p>
</div>

</body>
</html>
