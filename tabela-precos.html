<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielvogel Joias — Tabela de Preços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Mesma identidade visual provisória do painel de encomendas.
     Troque aqui também quando a Lohana mandar o logo/cores reais. */
  :root {
    --bg: #141210;
    --bg-elevated: #1c1a17;
    --gold: #C9A24B;
    --gold-soft: #8f7a4d;
    --cream: #F3EDE1;
    --cream-dim: #b8b0a0;
    --line: #2c2822;
    --danger: #b5544a;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  header {
    padding: 28px 20px 22px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  .logo-placeholder {
    font-family: var(--font-display);
    font-size: 30px;
    letter-spacing: 3px;
    color: var(--gold);
    font-weight: 500;
  }
  .logo-sub {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--cream-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .search-input {
    flex: 1;
    min-width: 180px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 10px 14px;
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .search-input:focus { outline: none; border-color: var(--gold); }

  .btn {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    padding: 10px 20px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .btn:hover { background: var(--gold); color: var(--bg); }
  .btn-solid { background: var(--gold); color: var(--bg); }
  .btn-solid:hover { background: var(--gold-soft); }
  .btn-text {
    border: none;
    background: none;
    color: var(--cream-dim);
    font-size: 13px;
    padding: 4px 8px;
  }
  .btn-text:hover { color: var(--gold); background: none; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: var(--cream); }

  .group {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .group-header {
    font-family: var(--font-display);
    font-size: 21px;
    color: var(--gold);
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    letter-spacing: 0.3px;
  }

  .entry-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s;
  }
  .entry-row:last-child { border-bottom: none; }
  .entry-row:hover { background: rgba(201,162,75,0.06); }

  .entry-info { flex: 1; min-width: 0; }
  .entry-spec {
    font-size: 13px;
    color: var(--cream);
    margin: 0 0 3px;
  }
  .entry-spec .stone { color: var(--gold); font-style: italic; }
  .entry-notes {
    font-size: 12px;
    color: var(--cream-dim);
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .entry-price {
    font-family: var(--font-display);
    font-size: 19px;
    color: var(--gold);
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    color: var(--cream-dim);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-overlay.hidden { display: none; }

  .modal {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
  }

  .modal h2 {
    font-family: var(--font-display);
    color: var(--gold);
    margin: 0 0 18px;
    font-size: 22px;
    text-align: center;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--cream-dim);
    margin-bottom: 5px;
    letter-spacing: 0.3px;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 9px 10px;
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
  .field textarea { resize: vertical; min-height: 50px; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 10px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo-placeholder">SPIELVOGEL JOIAS</div>
  <div class="logo-sub">Tabela de Preços</div>
</header>

<main>
  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar por modelo, pedra, material...">
    <button class="btn btn-solid" id="addBtn">+ Novo Item</button>
  </div>
  <div id="list"></div>
</main>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Novo Item</h2>
    <input type="hidden" id="entryId">

    <div class="field">
      <label>Modelo do anel</label>
      <input type="text" id="fieldModel" placeholder="Ex: Anel Ziel">
    </div>

    <div class="field-row">
      <div class="field">
        <label>Material</label>
        <input type="text" id="fieldMaterial" placeholder="Ex: Ouro 18k">
      </div>
      <div class="field">
        <label>Pedra principal</label>
        <input type="text" id="fieldStone" placeholder="Ex: Diamante">
      </div>
    </div>

    <div class="field">
      <label>Detalhe da pedra (tamanho/quilate/pontos)</label>
      <input type="text" id="fieldStoneDetail" placeholder="Ex: 20 pontos">
    </div>

    <div class="field">
      <label>Valor final</label>
      <input type="text" id="fieldPrice" placeholder="Ex: R$ 3.200,00">
    </div>

    <div class="field">
      <label>Observações</label>
      <textarea id="fieldNotes" placeholder="Contexto, cliente de referência, detalhes extras..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-text btn-danger" id="deleteBtn" style="display:none;">Excluir</button>
      <div style="flex:1;"></div>
      <button class="btn-text" id="cancelBtn">Cancelar</button>
      <button class="btn btn-solid" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* Mesmo projeto Firebase do painel de encomendas, só que usando
   uma coleção diferente ("tabela_precos"), então não precisa
   criar nada novo no Firebase, é o mesmo de sempre. */
const firebaseConfig = {
  apiKey: "AIzaSyBY2aOX2FSTdjdOH9Nqyi4lAVkfsLws9ek",
  authDomain: "spielvogel-painel.firebaseapp.com",
  projectId: "spielvogel-painel",
  storageBucket: "spielvogel-painel.firebasestorage.app",
  messagingSenderId: "368754911719",
  appId: "1:368754911719:web:c452ad8cca48410de33542"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = "tabela_precos";

const listEl = document.getElementById("list");
const searchInput = document.getElementById("searchInput");
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const entryIdInput = document.getElementById("entryId");
const fieldModel = document.getElementById("fieldModel");
const fieldMaterial = document.getElementById("fieldMaterial");
const fieldStone = document.getElementById("fieldStone");
const fieldStoneDetail = document.getElementById("fieldStoneDetail");
const fieldPrice = document.getElementById("fieldPrice");
const fieldNotes = document.getElementById("fieldNotes");
const deleteBtn = document.getElementById("deleteBtn");
const toastEl = document.getElementById("toast");

let currentEntries = [];

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function parsePrice(str) {
  if (!str) return 0;
  const cleaned = String(str).replace(/[^\d,.-]/g, "");
  const normalized = cleaned.replace(/\.(?=\d{3}(,|$))/g, "").replace(",", ".");
  const val = parseFloat(normalized);
  return isNaN(val) ? 0 : val;
}

function matchesSearch(entry, term) {
  if (!term) return true;
  const t = term.toLowerCase();
  return (entry.ringModel || "").toLowerCase().includes(t)
    || (entry.stone || "").toLowerCase().includes(t)
    || (entry.material || "").toLowerCase().includes(t)
    || (entry.notes || "").toLowerCase().includes(t);
}

function renderList() {
  const term = searchInput.value.trim();
  const filtered = currentEntries.filter(e => matchesSearch(e, term));

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty-state">${term ? "Nenhum item encontrado pra essa busca." : "Nenhum item cadastrado ainda. Clique em + Novo Item pra começar."}</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(e => {
    const label = (e.ringModel || "Sem modelo").trim();
    const key = label.toLowerCase();
    if (!groups[key]) groups[key] = { label, items: [] };
    groups[key].items.push(e);
  });

  const sortedKeys = Object.keys(groups).sort((a, b) => a.localeCompare(b, "pt-BR"));

  listEl.innerHTML = "";
  sortedKeys.forEach(key => {
    const group = groups[key];
    group.items.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));

    const groupEl = document.createElement("div");
    groupEl.className = "group";

    const headerEl = document.createElement("div");
    headerEl.className = "group-header";
    headerEl.textContent = group.label;
    groupEl.appendChild(headerEl);

    group.items.forEach(entry => {
      const row = document.createElement("div");
      row.className = "entry-row";
      row.innerHTML = `
        <div class="entry-info">
          <p class="entry-spec">
            ${entry.material || ""}${entry.material && entry.stone ? " · " : ""}<span class="stone">${entry.stone || ""}</span>${entry.stoneDetail ? ` (${entry.stoneDetail})` : ""}
          </p>
          ${entry.notes ? `<p class="entry-notes">${entry.notes}</p>` : ""}
        </div>
        <div class="entry-price">${entry.price || ""}</div>
      `;
      row.addEventListener("click", () => openEditModal(entry));
      groupEl.appendChild(row);
    });

    listEl.appendChild(groupEl);
  });
}

function openAddModal() {
  modalTitle.textContent = "Novo Item";
  entryIdInput.value = "";
  fieldModel.value = "";
  fieldMaterial.value = "";
  fieldStone.value = "";
  fieldStoneDetail.value = "";
  fieldPrice.value = "";
  fieldNotes.value = "";
  deleteBtn.style.display = "none";
  modalOverlay.classList.remove("hidden");
}

function openEditModal(entry) {
  modalTitle.textContent = "Editar Item";
  entryIdInput.value = entry.id;
  fieldModel.value = entry.ringModel || "";
  fieldMaterial.value = entry.material || "";
  fieldStone.value = entry.stone || "";
  fieldStoneDetail.value = entry.stoneDetail || "";
  fieldPrice.value = entry.price || "";
  fieldNotes.value = entry.notes || "";
  deleteBtn.style.display = "inline-block";
  modalOverlay.classList.remove("hidden");
}

function closeModal() {
  modalOverlay.classList.add("hidden");
}

document.getElementById("addBtn").addEventListener("click", openAddModal);
document.getElementById("cancelBtn").addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) closeModal();
});
searchInput.addEventListener("input", renderList);

document.getElementById("saveBtn").addEventListener("click", async () => {
  const id = entryIdInput.value;
  const ringModel = fieldModel.value.trim();

  if (!ringModel) {
    showToast("Preencha ao menos o modelo do anel");
    return;
  }

  const saveBtnEl = document.getElementById("saveBtn");
  saveBtnEl.disabled = true;
  saveBtnEl.textContent = "Salvando...";

  try {
    const data = {
      ringModel,
      material: fieldMaterial.value.trim(),
      stone: fieldStone.value.trim(),
      stoneDetail: fieldStoneDetail.value.trim(),
      price: fieldPrice.value.trim(),
      notes: fieldNotes.value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (id) {
      await db.collection(COLLECTION).doc(id).update(data);
      showToast("Item atualizado");
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(COLLECTION).add(data);
      showToast("Item adicionado");
    }

    closeModal();
  } catch (err) {
    console.error(err);
    showToast("Erro ao salvar, tenta de novo");
  } finally {
    saveBtnEl.disabled = false;
    saveBtnEl.textContent = "Salvar";
  }
});

deleteBtn.addEventListener("click", async () => {
  const id = entryIdInput.value;
  if (!id) return;
  if (!confirm("Excluir este item da tabela? Essa ação não pode ser desfeita.")) return;
  await db.collection(COLLECTION).doc(id).delete();
  showToast("Item excluído");
  closeModal();
});

db.collection(COLLECTION).orderBy("ringModel", "asc").onSnapshot(snapshot => {
  currentEntries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderList();
}, err => {
  console.error("Erro ao carregar dados:", err);
  listEl.innerHTML = '<p style="text-align:center;color:#b5544a;">Erro ao conectar com o banco de dados.</p>';
});
</script>

</body>
</html>
