<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielvogel Joias — Tabela de Preços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Mesma identidade visual provisória do painel de encomendas.
     Troque aqui também quando a Lohana mandar o logo/cores reais. */
  :root {
    --bg: #141210;
    --bg-elevated: #1c1a17;
    --gold: #C9A24B;
    --gold-soft: #8f7a4d;
    --cream: #F3EDE1;
    --cream-dim: #b8b0a0;
    --line: #2c2822;
    --danger: #b5544a;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  header {
    padding: 28px 20px 22px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  .logo-placeholder {
    font-family: var(--font-display);
    font-size: 30px;
    letter-spacing: 3px;
    color: var(--gold);
    font-weight: 500;
  }
  .logo-sub {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--cream-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-input {
    flex: 1;
    min-width: 180px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 10px 14px;
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .search-input:focus { outline: none; border-color: var(--gold); }

  .btn {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    padding: 10px 20px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .btn:hover { background: var(--gold); color: var(--bg); }
  .btn-solid { background: var(--gold); color: var(--bg); }
  .btn-solid:hover { background: var(--gold-soft); }
  .btn-text {
    border: none;
    background: none;
    color: var(--cream-dim);
    font-size: 13px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .btn-text:hover { color: var(--gold); background: none; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: var(--cream); }

  .utility-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
  }

  .group {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .group-header {
    font-family: var(--font-display);
    font-size: 21px;
    color: var(--gold);
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    letter-spacing: 0.3px;
  }

  .entry-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s;
  }
  .entry-row:last-child { border-bottom: none; }
  .entry-row:hover { background: rgba(201,162,75,0.06); }

  .entry-photo {
    width: 54px;
    height: 54px;
    border-radius: 4px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--line);
  }
  .entry-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .entry-info { flex: 1; min-width: 0; }

  .stone-tag {
    display: inline-block;
    font-size: 11px;
    color: var(--gold-soft);
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 3px;
    margin-bottom: 6px;
  }

  .entry-desc {
    font-size: 13px;
    color: var(--cream);
    line-height: 1.5;
    margin: 0 0 4px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }

  .link-3d {
    display: inline-block;
    font-size: 12px;
    color: var(--gold);
    text-decoration: none;
    margin-top: 2px;
  }
  .link-3d:hover { text-decoration: underline; }

  .margin-note {
    font-size: 11px;
    color: var(--gold-soft);
    font-style: italic;
    margin: 6px 0 0;
  }

  .entry-price {
    font-family: var(--font-display);
    font-size: 19px;
    color: var(--gold);
    white-space: nowrap;
    padding-top: 2px;
  }

  .empty-state {
    text-align: center;
    color: var(--cream-dim);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-overlay.hidden { display: none; }

  .modal {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
  }

  .modal h2 {
    font-family: var(--font-display);
    color: var(--gold);
    margin: 0 0 18px;
    font-size: 22px;
    text-align: center;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--cream-dim);
    margin-bottom: 5px;
    letter-spacing: 0.3px;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--cream);
    padding: 9px 10px;
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
  .field textarea { resize: vertical; min-height: 50px; }
  .field textarea#fieldDescription { min-height: 90px; }
  .field textarea#fieldMargin { min-height: 44px; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .photo-preview {
    display: flex;
    margin-bottom: 8px;
  }
  .photo-placeholder {
    width: 100%;
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 14px 10px;
    text-align: center;
    font-size: 12px;
    color: var(--cream-dim);
  }
  .photo-thumb {
    position: relative;
    width: 78px;
    height: 78px;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-thumb .remove-photo {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(0,0,0,0.75);
    color: var(--cream);
    border: none;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo-thumb .remove-photo:hover { background: var(--danger); }

  .upload-status {
    font-size: 12px;
    color: var(--gold-soft);
    margin-top: 6px;
    min-height: 16px;
  }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 10px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo-placeholder">SPIELVOGEL JOIAS</div>
  <div class="logo-sub">Tabela de Preços</div>
</header>

<main>
  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar por modelo, pedra, descrição...">
    <button class="btn btn-solid" id="addBtn">+ Novo Item</button>
  </div>
  <div class="utility-row">
    <button class="btn-text" id="importBtn">Padronizar dados (importar novo formato) ↺</button>
  </div>
  <div id="list"></div>
</main>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Novo Item</h2>
    <input type="hidden" id="entryId">

    <div class="field">
      <label>Modelo do anel</label>
      <input type="text" id="fieldModel" placeholder="Ex: Anel Ziel">
    </div>

    <div class="field">
      <label>Pedra principal</label>
      <input type="text" id="fieldStone" placeholder="Ex: Diamante">
    </div>

    <div class="field">
      <label>Descrição</label>
      <textarea id="fieldDescription" placeholder="Ex: Anel Ziel em ouro 18k amarelo, com diamante de 30 pontos, lapidação marquise de 3x1,5mm cada."></textarea>
    </div>

    <div class="field">
      <label>Valor final</label>
      <input type="text" id="fieldPrice" placeholder="Ex: R$ 3.200,00">
    </div>

    <div class="field">
      <label>Margem (ajustes possíveis)</label>
      <textarea id="fieldMargin" placeholder="Ex: pode fechar com pedra menor por R$ 2.990,00, dependendo do cliente"></textarea>
    </div>

    <div class="field">
      <label>Foto de referência (cole com Ctrl+V ou escolha um arquivo)</label>
      <div class="photo-preview" id="photoPreview"></div>
      <input type="file" id="fieldPhoto" accept="image/*">
      <div class="upload-status" id="uploadStatus"></div>
    </div>

    <div class="field">
      <label>Link (visualização 3D)</label>
      <input type="text" id="fieldLink3d" placeholder="https://...">
    </div>

    <div class="modal-actions">
      <button class="btn-text btn-danger" id="deleteBtn" style="display:none;">Excluir</button>
      <div style="flex:1;"></div>
      <button class="btn-text" id="cancelBtn">Cancelar</button>
      <button class="btn btn-solid" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* Mesmo projeto Firebase do painel de encomendas, só que usando
   uma coleção diferente ("tabela_precos"), então não precisa
   criar nada novo no Firebase, é o mesmo de sempre. */
const firebaseConfig = {
  apiKey: "AIzaSyBY2aOX2FSTdjdOH9Nqyi4lAVkfsLws9ek",
  authDomain: "spielvogel-painel.firebaseapp.com",
  projectId: "spielvogel-painel",
  storageBucket: "spielvogel-painel.firebasestorage.app",
  messagingSenderId: "368754911719",
  appId: "1:368754911719:web:c452ad8cca48410de33542"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = "tabela_precos";

/* Compressão de foto: mesma lógica usada no painel de encomendas,
   guarda como base64 direto no documento (sem depender de Storage/Blaze). */
function compressImage(file, maxWidth = 700, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const listEl = document.getElementById("list");
const searchInput = document.getElementById("searchInput");
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const entryIdInput = document.getElementById("entryId");
const fieldModel = document.getElementById("fieldModel");
const fieldStone = document.getElementById("fieldStone");
const fieldDescription = document.getElementById("fieldDescription");
const fieldPrice = document.getElementById("fieldPrice");
const fieldMargin = document.getElementById("fieldMargin");
const fieldPhoto = document.getElementById("fieldPhoto");
const fieldLink3d = document.getElementById("fieldLink3d");
const photoPreviewEl = document.getElementById("photoPreview");
const uploadStatus = document.getElementById("uploadStatus");
const deleteBtn = document.getElementById("deleteBtn");
const toastEl = document.getElementById("toast");

let currentEntries = [];
let photoDraft = null; // string base64 da foto sendo criada/editada agora, ou null

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function parsePrice(str) {
  if (!str) return 0;
  const cleaned = String(str).replace(/[^\d,.-]/g, "");
  const normalized = cleaned.replace(/\.(?=\d{3}(,|$))/g, "").replace(",", ".");
  const val = parseFloat(normalized);
  return isNaN(val) ? 0 : val;
}

function matchesSearch(entry, term) {
  if (!term) return true;
  const t = term.toLowerCase();
  return (entry.ringModel || "").toLowerCase().includes(t)
    || (entry.stone || "").toLowerCase().includes(t)
    || (entry.description || "").toLowerCase().includes(t)
    || (entry.margin || "").toLowerCase().includes(t);
}

function renderPhotoPreview() {
  photoPreviewEl.innerHTML = "";
  if (!photoDraft) {
    const placeholder = document.createElement("div");
    placeholder.className = "photo-placeholder";
    placeholder.textContent = "Cole uma foto aqui (Ctrl+V) ou escolha um arquivo abaixo";
    photoPreviewEl.appendChild(placeholder);
    return;
  }
  const wrap = document.createElement("div");
  wrap.className = "photo-thumb";
  wrap.innerHTML = `
    <img src="${photoDraft}">
    <button type="button" class="remove-photo" title="Remover">×</button>
  `;
  wrap.querySelector(".remove-photo").addEventListener("click", (e) => {
    e.stopPropagation();
    e.preventDefault();
    photoDraft = null;
    renderPhotoPreview();
  });
  photoPreviewEl.appendChild(wrap);
}

function renderList() {
  const term = searchInput.value.trim();
  const filtered = currentEntries.filter(e => matchesSearch(e, term));

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty-state">${term ? "Nenhum item encontrado pra essa busca." : "Nenhum item cadastrado ainda. Clique em + Novo Item pra começar."}</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(e => {
    const label = (e.ringModel || "Sem modelo").trim();
    const key = label.toLowerCase();
    if (!groups[key]) groups[key] = { label, items: [] };
    groups[key].items.push(e);
  });

  const sortedKeys = Object.keys(groups).sort((a, b) => a.localeCompare(b, "pt-BR"));

  listEl.innerHTML = "";
  sortedKeys.forEach(key => {
    const group = groups[key];
    group.items.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));

    const groupEl = document.createElement("div");
    groupEl.className = "group";

    const headerEl = document.createElement("div");
    headerEl.className = "group-header";
    headerEl.textContent = group.label;
    groupEl.appendChild(headerEl);

    group.items.forEach(entry => {
      const row = document.createElement("div");
      row.className = "entry-row";
      row.innerHTML = `
        ${entry.photoUrl ? `<div class="entry-photo"><img src="${entry.photoUrl}"></div>` : ""}
        <div class="entry-info">
          ${entry.stone ? `<span class="stone-tag">${entry.stone}</span>` : ""}
          <p class="entry-desc">${entry.description || ""}</p>
          ${entry.link3d ? `<a class="link-3d" href="${entry.link3d}" target="_blank" rel="noopener">Ver em 3D ↗</a>` : ""}
          ${entry.margin ? `<p class="margin-note">Margem: ${entry.margin}</p>` : ""}
        </div>
        <div class="entry-price">${entry.price || ""}</div>
      `;
      const link3dEl = row.querySelector(".link-3d");
      if (link3dEl) link3dEl.addEventListener("click", (e) => e.stopPropagation());
      row.addEventListener("click", () => openEditModal(entry));
      groupEl.appendChild(row);
    });

    listEl.appendChild(groupEl);
  });
}

function openAddModal() {
  modalTitle.textContent = "Novo Item";
  entryIdInput.value = "";
  fieldModel.value = "";
  fieldStone.value = "";
  fieldDescription.value = "";
  fieldPrice.value = "";
  fieldMargin.value = "";
  fieldLink3d.value = "";
  fieldPhoto.value = "";
  photoDraft = null;
  renderPhotoPreview();
  uploadStatus.textContent = "";
  deleteBtn.style.display = "none";
  modalOverlay.classList.remove("hidden");
}

function openEditModal(entry) {
  modalTitle.textContent = "Editar Item";
  entryIdInput.value = entry.id;
  fieldModel.value = entry.ringModel || "";
  fieldStone.value = entry.stone || "";
  fieldDescription.value = entry.description || "";
  fieldPrice.value = entry.price || "";
  fieldMargin.value = entry.margin || "";
  fieldLink3d.value = entry.link3d || "";
  fieldPhoto.value = "";
  photoDraft = entry.photoUrl || null;
  renderPhotoPreview();
  uploadStatus.textContent = "";
  deleteBtn.style.display = "inline-block";
  modalOverlay.classList.remove("hidden");
}

function closeModal() {
  modalOverlay.classList.add("hidden");
}

fieldPhoto.addEventListener("change", async () => {
  const file = fieldPhoto.files && fieldPhoto.files[0];
  if (!file) return;
  uploadStatus.textContent = "Processando foto...";
  try {
    photoDraft = await compressImage(file);
    renderPhotoPreview();
    uploadStatus.textContent = "Foto pronta, clique em Salvar pra confirmar.";
  } catch (err) {
    console.error(err);
    showToast("Não consegui processar a foto");
  }
  fieldPhoto.value = "";
});

// Colar foto direto (Ctrl+V), tipo Canva, funciona com o modal aberto
document.addEventListener("paste", async (e) => {
  if (modalOverlay.classList.contains("hidden")) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type && item.type.startsWith("image/")) {
      const file = item.getAsFile();
      if (!file) continue;
      e.preventDefault();
      uploadStatus.textContent = "Processando foto colada...";
      try {
        photoDraft = await compressImage(file);
        renderPhotoPreview();
        uploadStatus.textContent = "Foto colada, clique em Salvar pra confirmar.";
      } catch (err) {
        console.error(err);
        showToast("Não consegui processar a foto colada");
      }
      break;
    }
  }
});

document.getElementById("addBtn").addEventListener("click", openAddModal);
document.getElementById("cancelBtn").addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) closeModal();
});
searchInput.addEventListener("input", renderList);

document.getElementById("saveBtn").addEventListener("click", async () => {
  const id = entryIdInput.value;
  const ringModel = fieldModel.value.trim();

  if (!ringModel) {
    showToast("Preencha ao menos o modelo do anel");
    return;
  }

  const saveBtnEl = document.getElementById("saveBtn");
  saveBtnEl.disabled = true;
  saveBtnEl.textContent = "Salvando...";

  try {
    const data = {
      ringModel,
      stone: fieldStone.value.trim(),
      description: fieldDescription.value.trim(),
      price: fieldPrice.value.trim(),
      margin: fieldMargin.value.trim(),
      link3d: fieldLink3d.value.trim(),
      photoUrl: photoDraft ? photoDraft : firebase.firestore.FieldValue.delete(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (id) {
      await db.collection(COLLECTION).doc(id).update(data);
      showToast("Item atualizado");
    } else {
      if (!photoDraft) delete data.photoUrl; // não existe ainda em documento novo
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(COLLECTION).add(data);
      showToast("Item adicionado");
    }

    closeModal();
  } catch (err) {
    console.error(err);
    showToast("Erro ao salvar, tenta de novo");
  } finally {
    saveBtnEl.disabled = false;
    saveBtnEl.textContent = "Salvar";
  }
});

deleteBtn.addEventListener("click", async () => {
  const id = entryIdInput.value;
  if (!id) return;
  if (!confirm("Excluir este item da tabela? Essa ação não pode ser desfeita.")) return;
  await db.collection(COLLECTION).doc(id).delete();
  showToast("Item excluído");
  closeModal();
});

/* ============================================================
   DADOS PADRONIZADOS — os 21 itens que já existiam na tabela,
   reescritos no novo formato (descrição em parágrafo corrido,
   nome "solitáio" corrigido pra "solitário"). O botão abaixo
   apaga os itens atuais e escreve esta lista no lugar. Fotos e
   links adicionados manualmente depois disso ficam preservados
   até a próxima vez que rodar a padronização.
   ============================================================ */
const SEED_DATA = [
  {
    "ringModel": "Anel Drei Steine",
    "stone": "Moissanite",
    "price": "R$ 3.290,00",
    "margin": "",
    "link3d": "",
    "description": "Anel Drei Steine em ouro 18k amarelo, com moissanite central de 5x2,5mm e duas pedras acessórias de 2mm."
  },
  {
    "ringModel": "Anel Glanz",
    "stone": "Safira rosa",
    "price": "R$ 2.790,00",
    "margin": "",
    "link3d": "",
    "description": "Anel Glanz em ouro 18k amarelo, com safira rosa central de 3x5mm e seis pedras laterais de 1,5x3mm."
  },
  {
    "ringModel": "Anel Glanz",
    "stone": "Moissanite",
    "price": "R$ 3.590,00",

document.getElementById("importBtn").addEventListener("click", async () => {
  const confirmed = confirm(
    "Isso vai apagar todos os itens atuais da tabela e substituir pela versão padronizada (descrição em parágrafo corrido, nomes corrigidos). " +
    "Fotos e links que você já tiver adicionado manualmente serão perdidos nessa troca. Quer continuar?"
  );
  if (!confirmed) return;

  try {
    const snapshot = await db.collection(COLLECTION).get();
    const batch = db.batch();
    snapshot.docs.forEach(doc => batch.delete(doc.ref));
    SEED_DATA.forEach(item => {
      const ref = db.collection(COLLECTION).doc();
      batch.set(ref, {
        ...item,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    await batch.commit();
    showToast("Tabela padronizada com sucesso");
  } catch (err) {
    console.error(err);
    showToast("Erro ao padronizar, tenta de novo");
  }
});

db.collection(COLLECTION).orderBy("ringModel", "asc").onSnapshot(snapshot => {
  currentEntries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderList();
}, err => {
  console.error("Erro ao carregar dados:", err);
  listEl.innerHTML = '<p style="text-align:center;color:#b5544a;">Erro ao conectar com o banco de dados.</p>';
});
</script>
