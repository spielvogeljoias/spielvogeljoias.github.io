<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielvogel Joias — Tabela de Preços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }

  .search-input {
    flex: 1; min-width: 180px; background: var(--bg-elevated-2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 14px; border-radius: 5px; font-family: var(--font-body); font-size: 14px;
  }
  .search-input:focus { outline: none; border-color: var(--gold); }

  .utility-row { display: flex; justify-content: flex-end; margin-bottom: 20px; }

  .group { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
  .group-header { font-family: var(--font-display); font-size: 19px; color: var(--gold); padding: 11px 15px; border-bottom: 1px solid var(--border); letter-spacing: 0.3px; }

  .entry-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 11px 15px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
  }
  .entry-row:last-child { border-bottom: none; }
  .entry-row:hover { background: rgba(212,175,90,0.06); }

  .entry-photo { width: 52px; height: 52px; border-radius: 5px; overflow: hidden; flex-shrink: 0; background: var(--border); cursor: zoom-in; }
  .entry-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .entry-info { flex: 1; min-width: 0; }
  .stone-tag { display: inline-block; font-size: 11px; color: var(--gold-soft); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; margin-bottom: 5px; }
  .entry-desc { font-size: 13px; color: var(--text); line-height: 1.5; margin: 0 0 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .link-3d { display: inline-block; font-size: 12px; color: var(--gold); text-decoration: none; margin-top: 2px; }
  .link-3d:hover { text-decoration: underline; }
  .margin-note { font-size: 11px; color: var(--gold-soft); font-style: italic; margin: 6px 0 0; }
  .entry-price { font-family: var(--font-display); font-size: 18px; color: var(--gold); white-space: nowrap; padding-top: 2px; }

  .empty-state { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 14px; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .photo-preview { display: flex; margin-bottom: 8px; }
  .photo-placeholder {
    width: 100%; border: 1px dashed var(--border); border-radius: 5px; padding: 14px 10px;
    text-align: center; font-size: 12px; color: var(--text-muted);
  }
</style>
</head>
<body>

<nav class="sv-nav">
  <a class="sv-nav-brand" href="entrada.html"><img src="logo.png" alt="Spielvogel Joias"></a>
  <div class="sv-nav-links">
    <a href="index.html">Painel de Encomendas</a>
    <a href="tabela-precos.html" class="ativo">Tabela de Preços</a>
    <a href="leads.html">Leads</a>
  </div>
</nav>

<main>
  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar por modelo, pedra, descrição...">
    <button class="btn btn-solid" id="addBtn">+ Novo Item</button>
  </div>
  <div id="list"></div>
</main>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Novo Item</h2>
    <input type="hidden" id="entryId">

    <div class="field"><label>Modelo do anel</label><input type="text" id="fieldModel" placeholder="Ex: Anel Ziel"></div>
    <div class="field"><label>Pedra principal</label><input type="text" id="fieldStone" placeholder="Ex: Diamante"></div>
    <div class="field"><label>Descrição</label><textarea id="fieldDescription" style="min-height:90px;" placeholder="Ex: Anel Ziel em ouro 18k amarelo, com diamante de 30 pontos, lapidação marquise de 3x1,5mm cada."></textarea></div>
    <div class="field"><label>Valor final</label><input type="text" id="fieldPrice" placeholder="Ex: R$ 3.200,00"></div>
    <div class="field"><label>Margem (ajustes possíveis)</label><textarea id="fieldMargin" style="min-height:44px;" placeholder="Ex: pode fechar com pedra menor por R$ 2.990,00, dependendo do cliente"></textarea></div>

    <div class="field">
      <label>Foto de referência (cole com Ctrl+V ou escolha um arquivo)</label>
      <div class="photo-preview" id="photoPreview"></div>
      <input type="file" id="fieldPhoto" accept="image/*">
      <div class="upload-status" id="uploadStatus"></div>
    </div>

    <div class="field"><label>Link (visualização 3D)</label><input type="text" id="fieldLink3d" placeholder="https://..."></div>

    <div class="modal-actions">
      <button class="btn-text btn-danger" id="deleteBtn" style="display:none;">Excluir</button>
      <div style="flex:1;"></div>
      <button class="btn-text" id="cancelBtn">Cancelar</button>
      <button class="btn btn-solid" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="fecharLightbox()">
  <button class="lightbox-fechar" onclick="fecharLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBY2aOX2FSTdjdOH9Nqyi4lAVkfsLws9ek",
  authDomain: "spielvogel-painel.firebaseapp.com",
  projectId: "spielvogel-painel",
  storageBucket: "spielvogel-painel.firebasestorage.app",
  messagingSenderId: "368754911719",
  appId: "1:368754911719:web:c452ad8cca48410de33542"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = "tabela_precos";

function compressImage(file, maxWidth = 700, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const listEl = document.getElementById("list");
const searchInput = document.getElementById("searchInput");
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const entryIdInput = document.getElementById("entryId");
const fieldModel = document.getElementById("fieldModel");
const fieldStone = document.getElementById("fieldStone");
const fieldDescription = document.getElementById("fieldDescription");
const fieldPrice = document.getElementById("fieldPrice");
const fieldMargin = document.getElementById("fieldMargin");
const fieldPhoto = document.getElementById("fieldPhoto");
const fieldLink3d = document.getElementById("fieldLink3d");
const photoPreviewEl = document.getElementById("photoPreview");
const uploadStatus = document.getElementById("uploadStatus");
const deleteBtn = document.getElementById("deleteBtn");
const toastEl = document.getElementById("toast");

let currentEntries = [];
let photoDraft = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function abrirLightbox(src) {
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").classList.add("aberto");
}
function fecharLightbox() {
  document.getElementById("lightbox").classList.remove("aberto");
}

function parsePrice(str) {
  if (!str) return 0;
  const cleaned = String(str).replace(/[^\d,.-]/g, "");
  const normalized = cleaned.replace(/\.(?=\d{3}(,|$))/g, "").replace(",", ".");
  const val = parseFloat(normalized);
  return isNaN(val) ? 0 : val;
}

function matchesSearch(entry, term) {
  if (!term) return true;
  const t = term.toLowerCase();
  return (entry.ringModel || "").toLowerCase().includes(t)
    || (entry.stone || "").toLowerCase().includes(t)
    || (entry.description || "").toLowerCase().includes(t)
    || (entry.margin || "").toLowerCase().includes(t);
}

function renderPhotoPreview() {
  photoPreviewEl.innerHTML = "";
  if (!photoDraft) {
    const placeholder = document.createElement("div");
    placeholder.className = "photo-placeholder";
    placeholder.textContent = "Cole uma foto aqui (Ctrl+V) ou escolha um arquivo abaixo";
    photoPreviewEl.appendChild(placeholder);
    return;
  }
  const wrap = document.createElement("div");
  wrap.className = "photo-thumb";
  wrap.innerHTML = `<img src="${photoDraft}"><button type="button" class="remove-photo" title="Remover">×</button>`;
  wrap.querySelector("img").addEventListener("click", (e) => { e.stopPropagation(); abrirLightbox(photoDraft); });
  wrap.querySelector(".remove-photo").addEventListener("click", (e) => {
    e.stopPropagation(); e.preventDefault();
    photoDraft = null;
    renderPhotoPreview();
  });
  photoPreviewEl.appendChild(wrap);
}

function renderList() {
  const term = searchInput.value.trim();
  const filtered = currentEntries.filter(e => matchesSearch(e, term));

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty-state">${term ? "Nenhum item encontrado pra essa busca." : "Nenhum item cadastrado ainda. Clique em + Novo Item pra começar."}</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(e => {
    const label = (e.ringModel || "Sem modelo").trim();
    const key = label.toLowerCase();
    if (!groups[key]) groups[key] = { label, items: [] };
    groups[key].items.push(e);
  });

  const sortedKeys = Object.keys(groups).sort((a, b) => a.localeCompare(b, "pt-BR"));

  listEl.innerHTML = "";
  sortedKeys.forEach(key => {
    const group = groups[key];
    group.items.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));

    const groupEl = document.createElement("div");
    groupEl.className = "group";

    const headerEl = document.createElement("div");
    headerEl.className = "group-header";
    headerEl.textContent = group.label;
    groupEl.appendChild(headerEl);

    group.items.forEach(entry => {
      const row = document.createElement("div");
      row.className = "entry-row";
      row.innerHTML = `
        ${entry.photoUrl ? `<div class="entry-photo"><img src="${entry.photoUrl}"></div>` : ""}
        <div class="entry-info">
          ${entry.stone ? `<span class="stone-tag">${entry.stone}</span>` : ""}
          <p class="entry-desc">${entry.description || ""}</p>
          ${entry.link3d ? `<a class="link-3d" href="${entry.link3d}" target="_blank" rel="noopener">Ver em 3D ↗</a>` : ""}
          ${entry.margin ? `<p class="margin-note">Margem: ${entry.margin}</p>` : ""}
        </div>
        <div class="entry-price">${entry.price || ""}</div>
      `;
      const photoEl = row.querySelector(".entry-photo img");
      if (photoEl) photoEl.addEventListener("click", (e) => { e.stopPropagation(); abrirLightbox(entry.photoUrl); });
      const link3dEl = row.querySelector(".link-3d");
      if (link3dEl) link3dEl.addEventListener("click", (e) => e.stopPropagation());
      row.addEventListener("click", () => openEditModal(entry));
      groupEl.appendChild(row);
    });

    listEl.appendChild(groupEl);
  });
}

function openAddModal() {
  modalTitle.textContent = "Novo Item";
  entryIdInput.value = "";
  fieldModel.value = "";
  fieldStone.value = "";
  fieldDescription.value = "";
  fieldPrice.value = "";
  fieldMargin.value = "";
  fieldLink3d.value = "";
  fieldPhoto.value = "";
  photoDraft = null;
  renderPhotoPreview();
  uploadStatus.textContent = "";
  deleteBtn.style.display = "none";
  modalOverlay.classList.remove("hidden");
}

function openEditModal(entry) {
  modalTitle.textContent = "Editar Item";
  entryIdInput.value = entry.id;
  fieldModel.value = entry.ringModel || "";
  fieldStone.value = entry.stone || "";
  fieldDescription.value = entry.description || "";
  fieldPrice.value = entry.price || "";
  fieldMargin.value = entry.margin || "";
  fieldLink3d.value = entry.link3d || "";
  fieldPhoto.value = "";
  photoDraft = entry.photoUrl || null;
  renderPhotoPreview();
  uploadStatus.textContent = "";
  deleteBtn.style.display = "inline-block";
  modalOverlay.classList.remove("hidden");
}

function closeModal() { modalOverlay.classList.add("hidden"); }

fieldPhoto.addEventListener("change", async () => {
  const file = fieldPhoto.files && fieldPhoto.files[0];
  if (!file) return;
  uploadStatus.textContent = "Processando foto...";
  try {
    photoDraft = await compressImage(file);
    renderPhotoPreview();
    uploadStatus.textContent = "Foto pronta, clique em Salvar pra confirmar.";
  } catch (err) {
    console.error(err);
    showToast("Não consegui processar a foto");
  }
  fieldPhoto.value = "";
});

document.addEventListener("paste", async (e) => {
  if (modalOverlay.classList.contains("hidden")) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type && item.type.startsWith("image/")) {
      const file = item.getAsFile();
      if (!file) continue;
      e.preventDefault();
      uploadStatus.textContent = "Processando foto colada...";
      try {
        photoDraft = await compressImage(file);
        renderPhotoPreview();
        uploadStatus.textContent = "Foto colada, clique em Salvar pra confirmar.";
      } catch (err) {
        console.error(err);
        showToast("Não consegui processar a foto colada");
      }
      break;
    }
  }
});

document.getElementById("addBtn").addEventListener("click", openAddModal);
document.getElementById("cancelBtn").addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });
searchInput.addEventListener("input", renderList);

document.getElementById("saveBtn").addEventListener("click", async () => {
  const id = entryIdInput.value;
  const ringModel = fieldModel.value.trim();
  if (!ringModel) { showToast("Preencha ao menos o modelo do anel"); return; }

  const saveBtnEl = document.getElementById("saveBtn");
  saveBtnEl.disabled = true;
  saveBtnEl.textContent = "Salvando...";

  try {
    const data = {
      ringModel,
      stone: fieldStone.value.trim(),
      description: fieldDescription.value.trim(),
      price: fieldPrice.value.trim(),
      margin: fieldMargin.value.trim(),
      link3d: fieldLink3d.value.trim(),
      photoUrl: photoDraft ? photoDraft : firebase.firestore.FieldValue.delete(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (id) {
      await db.collection(COLLECTION).doc(id).update(data);
      showToast("Item atualizado");
    } else {
      if (!photoDraft) delete data.photoUrl;
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(COLLECTION).add(data);
      showToast("Item adicionado");
    }
    closeModal();
  } catch (err) {
    console.error(err);
    showToast("Erro ao salvar, tenta de novo");
  } finally {
    saveBtnEl.disabled = false;
    saveBtnEl.textContent = "Salvar";
  }
});

deleteBtn.addEventListener("click", async () => {
  const id = entryIdInput.value;
  if (!id) return;
  if (!confirm("Excluir este item da tabela? Essa ação não pode ser desfeita.")) return;
  await db.collection(COLLECTION).doc(id).delete();
  showToast("Item excluído");
  closeModal();
});

db.collection(COLLECTION).orderBy("ringModel", "asc").onSnapshot(snapshot => {
  currentEntries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderList();
}, err => {
  console.error("Erro ao carregar dados:", err);
  listEl.innerHTML = '<p style="text-align:center;color:var(--danger);">Erro ao conectar com o banco de dados.</p>';
});
</script>

</body>
</html>
