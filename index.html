<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielvogel Joias — Painel de Encomendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  main { padding: 18px 24px 40px; }

  .toolbar { display: flex; justify-content: center; margin-bottom: 18px; }

  .board { display: grid; grid-template-columns: repeat(5, minmax(190px, 1fr)); gap: 10px; cursor: grab; }
  .board.arrastando-board { cursor: grabbing; user-select: none; }

  .column {
    display: flex; flex-direction: column;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 9px;
  }

  .column-title {
    font-family: var(--font-display); font-size: 15px; color: var(--gold);
    text-align: center; margin: 0 0 2px; letter-spacing: 0.3px;
  }
  .column-count { text-align: center; font-size: 10.5px; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.5px; }

  .card {
    background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px; margin-bottom: 8px; cursor: pointer;
  }
  .card:hover { border-color: var(--gold-soft); }

  .card-photo { width: 100%; height: 88px; object-fit: cover; border-radius: 5px; margin-bottom: 7px; display: block; background: var(--border); cursor: zoom-in; }

  .card-client { font-family: var(--font-display); font-size: 14px; color: var(--text); margin: 0 0 1px; }
  .card-model { font-size: 11px; color: var(--gold); margin: 0 0 4px; font-style: italic; }
  .card-investment { font-size: 11px; color: var(--text-secondary); margin: 0 0 5px; }
  .card-notes {
    font-size: 10.5px; color: var(--text-secondary); margin: 0 0 6px;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  .due-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 10px;
    padding: 2px 7px; border-radius: 4px; margin-bottom: 6px; border: 1px solid;
  }
  .badge-danger { color: var(--danger); border-color: var(--danger); background: rgba(196,103,90,0.12); }
  .badge-amber { color: var(--amber); border-color: var(--amber); background: rgba(212,162,74,0.12); }
  .badge-neutral { color: var(--text-muted); border-color: var(--border); background: rgba(255,255,255,0.03); }

  .photo-count-badge {
    position: absolute; bottom: 15px; right: 5px; background: rgba(0,0,0,0.7);
    color: var(--text); font-size: 10px; padding: 2px 6px; border-radius: 3px;
  }
  .attachment-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--gold-soft);
    border: 1px solid var(--border); padding: 2px 7px; border-radius: 4px; margin-bottom: 6px;
  }

  .empty-column { text-align: center; color: var(--text-muted); font-size: 11px; padding: 16px 4px; opacity: 0.7; }

  .photos-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .photo-count-badge-modal {
    position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.7);
    color: var(--text); font-size: 11px; padding: 2px 6px; border-radius: 3px;
  }
  .pdf-thumb {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; background: var(--border); color: var(--gold);
    text-decoration: none; padding: 4px; text-align: center;
  }
  .pdf-thumb .pdf-label { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 1px; }
  .pdf-thumb .pdf-name { color: var(--text-muted); font-size: 9px; margin-top: 3px; max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .upload-status { font-size: 12px; color: var(--gold-soft); margin-top: 6px; min-height: 16px; }

  @media (max-width: 1000px) {
    .board { display: flex; overflow-x: auto; }
    .column { flex: 0 0 178px; }
  }
</style>
</head>
<body>

<nav class="sv-nav">
  <a class="sv-nav-brand" href="entrada.html"><img src="logo.png" alt="Spielvogel Joias"></a>
  <div class="sv-nav-links">
    <a href="index.html" class="ativo">Painel de Encomendas</a>
    <a href="tabela-precos.html">Tabela de Preços</a>
    <a href="leads.html">Leads</a>
  </div>
</nav>

<main>
  <div class="toolbar">
    <button class="btn btn-solid" id="addBtn">+ Nova Encomenda</button>
  </div>
  <div class="board" id="board"></div>
</main>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nova Encomenda</h2>
    <input type="hidden" id="cardId">

    <div class="field"><label>Nome do cliente</label><input type="text" id="fieldClient" placeholder="Ex: Caio Fernandes"></div>
    <div class="field"><label>Modelo da joia</label><input type="text" id="fieldModel" placeholder="Ex: Anel Ziel"></div>
    <div class="field"><label>Investimento combinado</label><input type="text" id="fieldInvestment" placeholder="Ex: R$ 3.200,00"></div>
    <div class="field"><label>Data de envio combinada</label><input type="date" id="fieldDueDate"></div>
    <div class="field"><label>Observações</label><textarea id="fieldNotes" placeholder="Detalhes, prazos, combinações..."></textarea></div>

    <div class="field">
      <label>Fotos e arquivos (PDF, contrato, termo...)</label>
      <div class="photos-grid" id="filesGrid"></div>
      <input type="file" id="fieldPhoto" accept="image/*,application/pdf" multiple>
      <div class="upload-status" id="uploadStatus"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-text btn-danger" id="deleteBtn" style="display:none;">Excluir</button>
      <div style="flex:1;"></div>
      <button class="btn-text" id="cancelBtn">Cancelar</button>
      <button class="btn btn-solid" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="fecharLightbox()">
  <button class="lightbox-fechar" onclick="fecharLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBY2aOX2FSTdjdOH9Nqyi4lAVkfsLws9ek",
  authDomain: "spielvogel-painel.firebaseapp.com",
  projectId: "spielvogel-painel",
  storageBucket: "spielvogel-painel.firebasestorage.app",
  messagingSenderId: "368754911719",
  appId: "1:368754911719:web:c452ad8cca48410de33542"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = "encomendas";

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function compressImage(file, maxWidth = 700, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function compressPDF(file, maxWidthPx = 1100, quality = 0.6) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const { jsPDF } = window.jspdf;
  let outputPdf = null;

  for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
    const page = await pdf.getPage(pageNum);
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = Math.min(1, maxWidthPx / baseViewport.width);
    const viewport = page.getViewport({ scale });

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext("2d");
    await page.render({ canvasContext: ctx, viewport }).promise;

    const imgData = canvas.toDataURL("image/jpeg", quality);

    if (!outputPdf) {
      outputPdf = new jsPDF({ unit: "px", format: [canvas.width, canvas.height] });
    } else {
      outputPdf.addPage([canvas.width, canvas.height]);
    }
    outputPdf.addImage(imgData, "JPEG", 0, 0, canvas.width, canvas.height);
  }

  let uri = outputPdf.output("datauristring");
  uri = uri.replace(/;filename=[^;]*/, "");
  return uri;
}

async function compressPdfFile(file) {
  const original = await readFileAsDataURL(file);
  try {
    const compressed = await compressPDF(file);
    if (compressed.length < original.length) {
      const savedPct = Math.round((1 - compressed.length / original.length) * 100);
      uploadStatus.textContent = `${file.name}: comprimido (~${savedPct}% menor)`;
      return compressed;
    }
    uploadStatus.textContent = `${file.name}: já estava leve, mantido original`;
    return original;
  } catch (err) {
    console.error("Erro ao comprimir PDF:", err);
    uploadStatus.textContent = `${file.name}: não consegui comprimir, anexado original`;
    return original;
  }
}

const COLUMNS = ["Em Aprovação", "A Fazer", "Pré-Produção", "Em Execução", "Finalizados"];

const boardEl = document.getElementById("board");
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const cardIdInput = document.getElementById("cardId");
const fieldClient = document.getElementById("fieldClient");
const fieldModel = document.getElementById("fieldModel");
const fieldInvestment = document.getElementById("fieldInvestment");
const fieldDueDate = document.getElementById("fieldDueDate");
const fieldNotes = document.getElementById("fieldNotes");
const fieldPhoto = document.getElementById("fieldPhoto");
const filesGrid = document.getElementById("filesGrid");
const uploadStatus = document.getElementById("uploadStatus");
const deleteBtn = document.getElementById("deleteBtn");
const toastEl = document.getElementById("toast");

let currentCards = [];
let filesDraft = [];

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function abrirLightbox(src) {
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").classList.add("aberto");
}
function fecharLightbox() {
  document.getElementById("lightbox").classList.remove("aberto");
}

function abrirPdfBase64(dataUri) {
  try {
    const base64 = dataUri.split(",")[1];
    const binario = atob(base64);
    const bytes = new Uint8Array(binario.length);
    for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
    const blob = new Blob([bytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err) {
    console.error(err);
    alert("Não consegui abrir esse PDF pra visualizar.");
  }
}

function urgencyBadgeHtml(card) {
  if (!card.dueDate) return "";
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(card.dueDate + "T00:00:00");
  const diffDays = Math.round((due - today) / 86400000);

  let cls = "badge-neutral";
  if (diffDays <= 0) cls = "badge-danger";
  else if (diffDays <= 3) cls = "badge-amber";

  return `<span class="due-badge ${cls}">📅 ${due.toLocaleDateString("pt-BR")}</span>`;
}

function renderFilesGrid() {
  filesGrid.innerHTML = "";
  filesDraft.forEach((item, index) => {
    const thumb = document.createElement("div");
    thumb.className = "photo-thumb";
    if (item.type === "image") {
      thumb.innerHTML = `<img src="${item.data}"><button type="button" class="remove-photo" title="Remover">×</button>`;
    } else {
      thumb.innerHTML = `
        <div class="pdf-thumb" role="button" tabindex="0">
          <span class="pdf-label">PDF</span><span class="pdf-name">${item.name}</span>
        </div>
        <button type="button" class="remove-photo" title="Remover">×</button>
      `;
      thumb.querySelector(".pdf-thumb").addEventListener("click", (e) => {
        e.stopPropagation();
        abrirPdfBase64(item.data);
      });
    }
    thumb.querySelector(".remove-photo").addEventListener("click", (e) => {
      e.stopPropagation(); e.preventDefault();
      filesDraft.splice(index, 1);
      renderFilesGrid();
    });
    filesGrid.appendChild(thumb);
  });
}

function renderBoard() {
  boardEl.innerHTML = "";
  COLUMNS.forEach((colName) => {
    const colEl = document.createElement("div");
    colEl.className = "column";

    const cardsInCol = currentCards.filter(c => c.status === colName);
    cardsInCol.sort((a, b) => {
      const dateA = a.dueDate ? new Date(a.dueDate + "T00:00:00") : null;
      const dateB = b.dueDate ? new Date(b.dueDate + "T00:00:00") : null;
      if (dateA && dateB) return dateA - dateB;
      if (dateA && !dateB) return -1;
      if (!dateA && dateB) return 1;
      return 0;
    });

    colEl.innerHTML = `
      <div class="column-title">${colName}</div>
      <div class="column-count">${cardsInCol.length} ${cardsInCol.length === 1 ? "item" : "itens"}</div>
    `;

    colEl.addEventListener("dragover", e => e.preventDefault());
    colEl.addEventListener("drop", e => {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain");
      const card = currentCards.find(c => c.id === id);
      if (card && card.status !== colName) moveCard(card, colName);
    });

    if (cardsInCol.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-column";
      empty.textContent = "Nenhuma encomenda aqui";
      colEl.appendChild(empty);
    }

    cardsInCol.forEach(card => {
      const files = card.files
        || (card.photos ? card.photos.map(p => ({ type: "image", data: p })) : null)
        || (card.photoUrl ? [{ type: "image", data: card.photoUrl }] : []);
      const firstImage = files.find(f => f.type === "image");
      const cardEl = document.createElement("div");
      cardEl.className = "card";
      cardEl.draggable = true;
      cardEl.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", card.id));

      cardEl.innerHTML = `
        ${firstImage ? `
          <div style="position:relative;">
            <img class="card-photo" src="${firstImage.data}">
            ${files.length > 1 ? `<span class="photo-count-badge">+${files.length - 1}</span>` : ""}
          </div>
        ` : (files.length > 0 ? `<div class="attachment-badge">📎 ${files.length} anexo${files.length > 1 ? "s" : ""}</div>` : "")}
        ${urgencyBadgeHtml(card)}
        <p class="card-client">${card.client || "Sem nome"}</p>
        ${card.model ? `<p class="card-model">${card.model}</p>` : ""}
        ${card.investment ? `<p class="card-investment">${card.investment}</p>` : ""}
        ${card.notes ? `<p class="card-notes">${card.notes}</p>` : ""}
      `;

      const photoEl = cardEl.querySelector(".card-photo");
      if (photoEl) {
        photoEl.addEventListener("click", (e) => { e.stopPropagation(); abrirLightbox(firstImage.data); });
      }
      cardEl.addEventListener("click", () => openEditModal(card));
      colEl.appendChild(cardEl);
    });

    boardEl.appendChild(colEl);
  });
}

function moveCard(card, newStatus) {
  db.collection(COLLECTION).doc(card.id).update({
    status: newStatus,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => showToast(`Movido para "${newStatus}"`))
    .catch(err => alert('Não consegui mover essa encomenda: ' + err.message));
}

function openAddModal() {
  modalTitle.textContent = "Nova Encomenda";
  cardIdInput.value = "";
  fieldClient.value = "";
  fieldModel.value = "";
  fieldInvestment.value = "";
  fieldDueDate.value = "";
  fieldNotes.value = "";
  fieldPhoto.value = "";
  filesDraft = [];
  renderFilesGrid();
  uploadStatus.textContent = "";
  deleteBtn.style.display = "none";
  modalOverlay.classList.remove("hidden");
}

function openEditModal(card) {
  modalTitle.textContent = "Editar Encomenda";
  cardIdInput.value = card.id;
  fieldClient.value = card.client || "";
  fieldModel.value = card.model || "";
  fieldInvestment.value = card.investment || "";
  fieldDueDate.value = card.dueDate || "";
  fieldNotes.value = card.notes || "";
  fieldPhoto.value = "";
  filesDraft = card.files
    ? [...card.files]
    : (card.photos ? card.photos.map(p => ({ name: "foto.jpg", type: "image", data: p }))
    : (card.photoUrl ? [{ name: "foto.jpg", type: "image", data: card.photoUrl }] : []));
  renderFilesGrid();
  uploadStatus.textContent = "";
  deleteBtn.style.display = "inline-block";
  modalOverlay.classList.remove("hidden");
}

function closeModal() { modalOverlay.classList.add("hidden"); }

fieldPhoto.addEventListener("change", async () => {
  const files = Array.from(fieldPhoto.files || []);
  if (files.length === 0) return;

  for (const file of files) {
    const isImage = file.type.startsWith("image/");
    const isPdf = file.type === "application/pdf";
    try {
      let data;
      if (isImage) { uploadStatus.textContent = `Processando ${file.name}...`; data = await compressImage(file); }
      else if (isPdf) { uploadStatus.textContent = `Comprimindo ${file.name}...`; data = await compressPdfFile(file); }
      else { uploadStatus.textContent = `Processando ${file.name}...`; data = await readFileAsDataURL(file); }
      filesDraft.push({ name: file.name, type: isImage ? "image" : "pdf", data });
      renderFilesGrid();
    } catch (err) {
      console.error(err);
      showToast(`Não consegui processar ${file.name}`);
    }
  }
  uploadStatus.textContent = "Anexo(s) prontos, clique em Salvar pra confirmar.";
  fieldPhoto.value = "";
});

document.getElementById("addBtn").addEventListener("click", openAddModal);
document.getElementById("cancelBtn").addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeModal(); });

document.getElementById("saveBtn").addEventListener("click", async () => {
  const id = cardIdInput.value;
  const client = fieldClient.value.trim();
  if (!client) { showToast("Preencha ao menos o nome do cliente"); return; }

  const saveBtnEl = document.getElementById("saveBtn");
  saveBtnEl.disabled = true;
  saveBtnEl.textContent = "Salvando...";

  try {
    const totalSizeKB = Math.round(filesDraft.reduce((sum, f) => sum + f.data.length, 0) / 1024);
    if (totalSizeKB > 900) {
      uploadStatus.textContent = `Anexos somam ${totalSizeKB}KB, passou do limite. Remova algum antes de salvar.`;
      saveBtnEl.disabled = false;
      saveBtnEl.textContent = "Salvar";
      return;
    }

    const dueDateValue = fieldDueDate.value.trim();
    const data = {
      client,
      model: fieldModel.value.trim(),
      investment: fieldInvestment.value.trim(),
      notes: fieldNotes.value.trim(),
      files: filesDraft,
      dueDate: dueDateValue ? dueDateValue : firebase.firestore.FieldValue.delete(),
      photos: firebase.firestore.FieldValue.delete(),
      photoUrl: firebase.firestore.FieldValue.delete(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (id) {
      await db.collection(COLLECTION).doc(id).update(data);
      showToast("Encomenda atualizada");
    } else {
      delete data.photos;
      delete data.photoUrl;
      if (!dueDateValue) delete data.dueDate;
      data.status = COLUMNS[0];
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(COLLECTION).add(data);
      showToast("Encomenda criada");
    }
    closeModal();
  } catch (err) {
    console.error(err);
    showToast("Erro ao salvar, tenta de novo");
  } finally {
    saveBtnEl.disabled = false;
    saveBtnEl.textContent = "Salvar";
  }
});

deleteBtn.addEventListener("click", async () => {
  const id = cardIdInput.value;
  if (!id) return;
  if (!confirm("Excluir esta encomenda? Essa ação não pode ser desfeita.")) return;
  await db.collection(COLLECTION).doc(id).delete();
  showToast("Encomenda excluída");
  closeModal();
});

function ativarArrastarScroll(board){
  let arrastando = false, inicioX = 0, scrollInicial = 0;
  board.addEventListener('mousedown', (e) => {
    if (e.target.closest('.card, button, a, input, select, textarea')) return;
    arrastando = true;
    board.classList.add('arrastando-board');
    inicioX = e.pageX;
    scrollInicial = board.scrollLeft;
  });
  window.addEventListener('mousemove', (e) => {
    if (!arrastando) return;
    e.preventDefault();
    board.scrollLeft = scrollInicial - (e.pageX - inicioX);
  });
  window.addEventListener('mouseup', () => {
    arrastando = false;
    board.classList.remove('arrastando-board');
  });
}

db.collection(COLLECTION).orderBy("createdAt", "asc").onSnapshot(snapshot => {
  currentCards = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderBoard();
}, err => {
  console.error("Erro ao carregar dados:", err);
  boardEl.innerHTML = '<p style="text-align:center;color:var(--danger);grid-column:1/-1;">Erro ao conectar com o banco de dados. Confira a configuração do Firebase no topo do código.</p>';
});

ativarArrastarScroll(boardEl);
</script>

</body>
</html>
