<style>
  :root{
    --bg: #FAF8F4;
    --surface: #FFFFFF;
    --border: #E7E1D6;
    --text: #2B2620;
    --text-secondary: #6B6459;
    --text-muted: #9A9284;
    --gold: #B8860B;
    --gold-dark: #8A6508;
    --danger: #B0503F;

    --fase-descoberta-bg: #EDE4D3;   --fase-descoberta-border: #A0803F;  --fase-descoberta-text: #5C4620;
    --fase-criacao-bg: #EEDCF7;      --fase-criacao-border: #9B4FC7;     --fase-criacao-text: #5A2680;
    --fase-decisao-bg: #FBDECB;      --fase-decisao-border: #E0652C;     --fase-decisao-text: #8A3410;
    --fase-aprovacao-bg: #FCEBA8;    --fase-aprovacao-border: #C99A0A;   --fase-aprovacao-text: #684D04;
    --fase-formalizacao-bg: #CDF0E0; --fase-formalizacao-border: #1F9C6C;--fase-formalizacao-text: #0F5138;
    --fase-cancelado-bg: #FAD6CC;    --fase-cancelado-border: #D6462A;   --fase-cancelado-text: #7A2210;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family:'Manrope', sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  /* Topbar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; background:var(--surface); border-bottom:1px solid var(--border);
  }
  .topbar h1{
    font-family:'Playfair Display', serif; font-size:22px; font-weight:600; margin:0;
    color:var(--text);
  }
  .topbar nav a{
    color:var(--text-secondary); text-decoration:none; font-size:14px; font-weight:500;
    margin-left:20px; padding-bottom:2px; border-bottom:1px solid transparent;
  }
  .topbar nav a:hover{ color:var(--gold-dark); border-bottom-color:var(--gold); }
  .topbar nav a.ativo{ color:var(--gold-dark); border-bottom-color:var(--gold); }

  /* Barra de resumo */
  .resumo{
    display:flex; gap:28px; padding:14px 28px; background:var(--surface);
    border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .resumo .item{ display:flex; flex-direction:column; gap:2px; }
  .resumo .item .valor{ font-size:20px; font-weight:700; }
  .resumo .item .rotulo{ font-size:12px; color:var(--text-secondary); }

  /* Barra de ferramentas */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px;
  }
  #banner-firebase{
    display:none; margin:0 28px 10px; padding:10px 14px; background:#FBF3DD;
    border:1px solid var(--gold); border-radius:8px; font-size:13px; color:var(--fase-aprovacao-text);
  }
  .btn{
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    border-radius:8px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); padding:9px 16px;
  }
  .btn:hover{ background:#F4F1EA; }
  .btn-principal{
    background:var(--gold); border-color:var(--gold); color:#FFFFFF;
  }
  .btn-principal:hover{ background:var(--gold-dark); }
  .btn-perigo{ color:var(--danger); border-color:var(--danger); background:var(--surface); }
  .btn-perigo:hover{ background:var(--fase-cancelado-bg); }

  /* Board */
  .board{
    display:flex; gap:9px; padding:4px 28px 32px; overflow-x:auto;
  }
  .coluna{
    flex:0 0 178px; display:flex; flex-direction:column;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    max-height:calc(100vh - 230px);
  }
  .coluna.coluna-cancelado{ margin-left:14px; border-color:var(--fase-cancelado-border); }

  .coluna-header{
    padding:8px 10px; border-bottom:2px solid; border-radius:10px 10px 0 0;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
  }
  .coluna-header .nome-etapa{ font-size:11.5px; font-weight:700; line-height:1.25; }
  .coluna-header .contagem{
    font-size:10.5px; font-weight:700; background:rgba(255,255,255,.65);
    padding:1px 6px; border-radius:999px; flex-shrink:0;
  }

  .coluna-corpo{
    flex:1; overflow-y:auto; padding:7px; display:flex; flex-direction:column; gap:6px;
    min-height:50px;
  }
  .coluna-corpo.arrastando-sobre{ background:#F4F1EA; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:7px;
    padding:7px 8px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card:hover{ border-color:var(--gold); }
  .card .linha-topo{ display:flex; align-items:center; gap:5px; }
  .card .ponto{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .card .nome{ font-size:11.5px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .data{ font-size:9.5px; color:var(--text-muted); }
  .card .linha-baixo{ display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
  .card .telefone-link{ font-size:9.5px; color:var(--gold-dark); text-decoration:none; }
  .card .telefone-link:hover{ text-decoration:underline; }
  .card .marcador{
    font-size:9px; font-weight:700; color:var(--gold-dark); background:var(--fase-aprovacao-bg);
    padding:1px 5px; border-radius:999px; border:1px solid var(--gold);
  }
  .card .obs-preview{
    font-size:9.5px; color:var(--text-secondary); margin-top:3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .vazio{ font-size:10.5px; color:var(--text-muted); text-align:center; padding:14px 4px; }

  /* Modal */
  .modal-fundo{
    display:none; position:fixed; inset:0; background:rgba(43,38,32,.45);
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-fundo.aberto{ display:flex; }
  .modal{
    background:var(--surface); border-radius:14px; width:100%; max-width:420px;
    max-height:90vh; overflow-y:auto; padding:24px;
  }
  .modal h2{ font-family:'Playfair Display', serif; font-size:19px; margin:0 0 18px; font-weight:600; }
  .campo{ margin-bottom:14px; }
  .campo label{ display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:5px; }
  .campo input[type=text], .campo input[type=date], .campo select, .campo textarea{
    width:100%; font-family:inherit; font-size:14px; padding:9px 10px;
    border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text);
  }
  .campo textarea{ min-height:64px; resize:vertical; }
  .campo-checkbox{ display:flex; align-items:center; gap:8px; }
  .campo-checkbox label{ margin:0; font-size:13px; font-weight:600; color:var(--text); }
  .erro-campo{ font-size:12px; color:var(--danger); margin-top:4px; display:none; }
  .modal-acoes{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:8px; }
  .modal-acoes .lado-direito{ display:flex; gap:8px; }
  .fechar-modal{ position:absolute; top:18px; right:20px; background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-muted); }

  @media (max-width:600px){
    .topbar, .resumo, .toolbar, .board{ padding-left:14px; padding-right:14px; }
    .coluna{ flex-basis:160px; }
  }
</style>
</head>

<script>
// ---------- Funil (ordem oficial, fechada em 15/09) ----------
const STAGES = [
  { id:'qualificacao',      nome:'Qualificação',                          fase:'descoberta' },
  { id:'entendimento',      nome:'Entendimento do projeto',               fase:'descoberta' },
  { id:'inspiracoes',       nome:'Inspirações enviadas',                  fase:'criacao' },
  { id:'cotacao_dev',       nome:'Cotação em desenvolvimento',            fase:'criacao' },
  { id:'cotacao_enviada',   nome:'Cotação enviada',                       fase:'decisao' },
  { id:'pedido_aberto',     nome:'Pedido em aberto (aprovado)',           fase:'aprovacao' },
  { id:'venda_aprovada',    nome:'Venda aprovada',                        fase:'aprovacao' },
  { id:'termo_enviado',     nome:'Termo enviado',                         fase:'formalizacao' },
  { id:'link_pagamento',    nome:'Link de pagamento enviado',             fase:'formalizacao' },
  { id:'em_producao',       nome:'Em produção',                           fase:'formalizacao' },
];
const STAGE_CANCELADO = { id:'cancelado', nome:'Pedido cancelado (deixamos as portas abertas)', fase:'cancelado' };
const TODAS_ETAPAS = [...STAGES, STAGE_CANCELADO];

function etapaPorId(id){ return TODAS_ETAPAS.find(e => e.id === id); }

// ---------- Dados iniciais (os 18 leads ditados em 15/09) ----------
// Observação: alguns desses leads tinham originalmente duas etapas marcadas ao mesmo
// tempo (ex.: "cotação enviada + negociação"). Como "negociação" e "aguardando
// aprovação" saíram do funil final, eles ficaram só na etapa que continua existindo.
// Isso está sinalizado na observação de cada um pra você revisar.
const SEED_LEADS = [
  { id:'seed-01', nome:'', telefone:'5551989059467', dataEntrada:'2026-09-12', etapa:'qualificacao', emPotencial:false, observacoes:'Mandei boas-vindas, não respondeu. Sem nome anotado ainda, ver pelo número.' },
  { id:'seed-02', nome:'Alexia', telefone:'5547991292918', dataEntrada:'2026-09-14', etapa:'entendimento', emPotencial:false, observacoes:'Respondeu sobre o que queria, expliquei, e não respondeu mais.' },
  { id:'seed-03', nome:'Gui', telefone:'5551998386810', dataEntrada:'2026-09-14', etapa:'qualificacao', emPotencial:false, observacoes:'Mandei boas-vindas e apresentação, não respondeu. Nome completo ainda não informado.' },
  { id:'seed-04', nome:'Gabriele', telefone:'5549991723999', dataEntrada:'2026-09-14', etapa:'cotacao_enviada', emPotencial:false, observacoes:'PDF de proposta enviado, perguntei qual opção fazia mais sentido, sem resposta.' },
  { id:'seed-05', nome:'Priscila Bernardo', telefone:'5548996887920', dataEntrada:'2026-09-14', etapa:'inspiracoes', emPotencial:false, observacoes:'Inspirações enviadas, aguardando retorno dela.' },
  { id:'seed-06', nome:'Christian CS', telefone:'5547991560202', dataEntrada:'2026-09-14', etapa:'cotacao_enviada', emPotencial:false, observacoes:'REVISAR: estava marcado como "negociação", etapa que saiu do funil final. Coloquei em cotação enviada por ora.' },
  { id:'seed-07', nome:'Jonathas', telefone:'5542999212798', dataEntrada:'2026-09-14', etapa:'cotacao_enviada', emPotencial:false, observacoes:'REVISAR: tinha dupla marcação "cotação enviada + negociação"; negociação saiu do funil final.' },
  { id:'seed-08', nome:'Julius', telefone:'5547984611074', dataEntrada:'2026-09-14', etapa:'qualificacao', emPotencial:false, observacoes:'Mandei boas-vindas, não respondeu.' },
  { id:'seed-09', nome:'Vicenzo', telefone:'5554996022690', dataEntrada:'2026-09-14', etapa:'qualificacao', emPotencial:false, observacoes:'Chegou à noite. Mandei boas-vindas, não respondeu.' },
  { id:'seed-10', nome:'Felipe', telefone:'', dataEntrada:'2026-09-15', etapa:'qualificacao', emPotencial:false, observacoes:'Mandei boas-vindas, não respondeu. Falta telefone, adicionar manualmente.' },
  { id:'seed-11', nome:'Matheus', telefone:'5546984159639', dataEntrada:'2026-09-15', etapa:'inspiracoes', emPotencial:false, observacoes:'Inspirações enviadas, aguardando retorno.' },
  { id:'seed-12', nome:'Léo', telefone:'5541997742272', dataEntrada:'2026-09-14', etapa:'pedido_aberto', emPotencial:false, observacoes:'Pedido aprovado, ainda em análise pelo cliente.' },
  { id:'seed-13', nome:'Júlia', telefone:'5519971102288', dataEntrada:'2026-09-14', etapa:'cotacao_enviada', emPotencial:false, observacoes:'Chegou à noite.' },
  { id:'seed-14', nome:'Tainá Prudente', telefone:'5551996456561', dataEntrada:'2026-09-14', etapa:'entendimento', emPotencial:false, observacoes:'Chegou à noite.' },
  { id:'seed-15', nome:'Murilo', telefone:'5543991356837', dataEntrada:'2026-09-15', etapa:'cotacao_enviada', emPotencial:false, observacoes:'REVISAR: tinha dupla marcação "aguardando aprovação + cotação enviada"; aguardando aprovação saiu do funil final.' },
  { id:'seed-16', nome:'Jonathan', telefone:'5527997641068', dataEntrada:'2026-09-14', etapa:'inspiracoes', emPotencial:false, observacoes:'Chegou à noite. Inspirações enviadas, aguardando retorno.' },
  { id:'seed-17', nome:'João', telefone:'5541995021741', dataEntrada:'2026-09-15', etapa:'cotacao_enviada', emPotencial:false, observacoes:'Chegou de manhã.' },
  { id:'seed-18', nome:'Luiz', telefone:'5548991271868', dataEntrada:'2026-09-15', etapa:'qualificacao', emPotencial:false, observacoes:'' },
];

// ---------- Firebase (mesmo projeto "spielvogel-painel") ----------
// Cole aqui a config real do projeto (a mesma do index.html / tabela-precos.html).
// Enquanto ela não for colada, o CRM funciona 100% salvando no navegador (localStorage),
// só não fica sincronizado entre celular/computador/o Tiago até isso ser preenchido.
const firebaseConfig = {
  apiKey: "COLE_AQUI_SUA_API_KEY",
  authDomain: "spielvogel-painel.firebaseapp.com",
  projectId: "spielvogel-painel",
  storageBucket: "spielvogel-painel.appspot.com",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};
const FIREBASE_CONFIGURADO = firebaseConfig.apiKey !== "COLE_AQUI_SUA_API_KEY";

let db = null;
let leads = [];
let idLeadAberto = null;

if (FIREBASE_CONFIGURADO) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} else {
  const banner = document.getElementById('banner-firebase');
  banner.style.display = 'block';
  banner.textContent = 'Firebase ainda não configurado neste arquivo: os dados estão salvando só neste navegador por enquanto. Cole a firebaseConfig no topo do script pra sincronizar com o painel de pedidos.';
}

function iniciarLeads(){
  if (FIREBASE_CONFIGURADO) {
    db.collection('leads').get().then(snap => {
      if (snap.empty) {
        const lote = db.batch();
        SEED_LEADS.forEach(l => lote.set(db.collection('leads').doc(l.id), l));
        lote.commit();
      }
    });
    db.collection('leads').onSnapshot(snap => {
      leads = snap.docs.map(d => d.data());
      renderizarTudo();
    });
  } else {
    const salvo = localStorage.getItem('spielvogel_leads');
    leads = salvo ? JSON.parse(salvo) : SEED_LEADS.slice();
    if (!salvo) localStorage.setItem('spielvogel_leads', JSON.stringify(leads));
    renderizarTudo();
  }
}

function persistirLead(lead){
  if (FIREBASE_CONFIGURADO) {
    db.collection('leads').doc(lead.id).set(lead);
  } else {
    const i = leads.findIndex(l => l.id === lead.id);
    if (i >= 0) leads[i] = lead; else leads.push(lead);
    localStorage.setItem('spielvogel_leads', JSON.stringify(leads));
    renderizarTudo();
  }
}

function persistirExclusao(id){
  if (FIREBASE_CONFIGURADO) {
    db.collection('leads').doc(id).delete();
  } else {
    leads = leads.filter(l => l.id !== id);
    localStorage.setItem('spielvogel_leads', JSON.stringify(leads));
    renderizarTudo();
  }
}

// ---------- Utilidades ----------
function formatarTelefone(digits){
  if (!digits) return '';
  const semPais = digits.startsWith('55') ? digits.slice(2) : digits;
  const ddd = semPais.slice(0,2);
  const resto = semPais.slice(2);
  if (resto.length === 9) return `+55 ${ddd} ${resto.slice(0,5)}-${resto.slice(5)}`;
  return `+55 ${ddd} ${resto}`;
}
function linkWhatsapp(digits){
  if (!digits) return null;
  return `https://wa.me/${digits.replace(/\D/g,'')}`;
}
function formatarData(iso){
  if (!iso) return '';
  const [ano, mes, dia] = iso.split('-');
  return `${dia}/${mes}`;
}
function idNovo(){
  return 'lead-' + Date.now() + '-' + Math.floor(Math.random()*1000);
}

// ---------- Renderização ----------
function renderizarTudo(){
  renderizarResumo();
  renderizarBoard();
}

function renderizarResumo(){
  const ativos = leads.filter(l => l.etapa !== 'cancelado' && l.etapa !== 'venda_aprovada' && l.etapa !== 'em_producao').length;
  const emProducao = leads.filter(l => l.etapa === 'em_producao').length;
  const cancelados = leads.filter(l => l.etapa === 'cancelado').length;
  document.getElementById('resumo').innerHTML = `
    <div class="item"><span class="valor">${leads.length}</span><span class="rotulo">Total de leads</span></div>
    <div class="item"><span class="valor">${ativos}</span><span class="rotulo">Em andamento</span></div>
    <div class="item"><span class="valor">${emProducao}</span><span class="rotulo">Em produção</span></div>
    <div class="item"><span class="valor">${cancelados}</span><span class="rotulo">Cancelados</span></div>
  `;
}

function renderizarBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  TODAS_ETAPAS.forEach(etapa => {
    const leadsDaEtapa = leads.filter(l => l.etapa === etapa.id);
    const coluna = document.createElement('div');
    coluna.className = 'coluna' + (etapa.id === 'cancelado' ? ' coluna-cancelado' : '');

    const header = document.createElement('div');
    header.className = 'coluna-header';
    header.style.background = `var(--fase-${etapa.fase}-bg)`;
    header.style.borderColor = `var(--fase-${etapa.fase}-border)`;
    header.style.color = `var(--fase-${etapa.fase}-text)`;
    header.innerHTML = `<span class="nome-etapa">${etapa.nome}</span><span class="contagem">${leadsDaEtapa.length}</span>`;
    coluna.appendChild(header);

    const corpo = document.createElement('div');
    corpo.className = 'coluna-corpo';
    corpo.dataset.etapa = etapa.id;
    corpo.addEventListener('dragover', e => { e.preventDefault(); corpo.classList.add('arrastando-sobre'); });
    corpo.addEventListener('dragleave', () => corpo.classList.remove('arrastando-sobre'));
    corpo.addEventListener('drop', e => {
      e.preventDefault();
      corpo.classList.remove('arrastando-sobre');
      const id = e.dataTransfer.getData('text/plain');
      const lead = leads.find(l => l.id === id);
      if (lead && lead.etapa !== etapa.id) {
        lead.etapa = etapa.id;
        persistirLead(lead);
      }
    });

    if (leadsDaEtapa.length === 0) {
      corpo.innerHTML = '<div class="vazio">Sem leads aqui</div>';
    } else {
      leadsDaEtapa.forEach(lead => corpo.appendChild(criarCard(lead, etapa)));
    }

    coluna.appendChild(corpo);
    board.appendChild(coluna);
  });
}

function criarCard(lead, etapa){
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', lead.id));
  card.addEventListener('click', () => abrirModalEdicao(lead.id));

  const nomeExibido = lead.nome && lead.nome.trim() ? lead.nome : formatarTelefone(lead.telefone) || 'Sem nome';
  const link = linkWhatsapp(lead.telefone);

  card.innerHTML = `
    <div class="linha-topo">
      <span class="ponto" style="background:var(--fase-${etapa.fase}-border);"></span>
      <span class="nome">${nomeExibido}</span>
      <span class="data">${formatarData(lead.dataEntrada)}</span>
    </div>
    ${lead.observacoes ? `<div class="obs-preview">${lead.observacoes}</div>` : ''}
    <div class="linha-baixo">
      ${link ? `<a class="telefone-link" href="${link}" target="_blank" rel="noopener" onclick="event.stopPropagation();">WhatsApp</a>` : '<span></span>'}
      ${lead.emPotencial ? '<span class="marcador">Em potencial</span>' : ''}
    </div>
  `;
  return card;
}

// ---------- Modal ----------
function preencherSelectEtapas(){
  const select = document.getElementById('campo-etapa');
  select.innerHTML = TODAS_ETAPAS.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
}

function abrirModalNovo(){
  idLeadAberto = null;
  document.getElementById('modal-titulo').textContent = 'Adicionar lead';
  document.getElementById('campo-nome').value = '';
  document.getElementById('campo-telefone').value = '';
  document.getElementById('campo-data').value = new Date().toISOString().slice(0,10);
  document.getElementById('campo-etapa').value = 'qualificacao';
  document.getElementById('campo-potencial').checked = false;
  document.getElementById('campo-obs').value = '';
  document.getElementById('erro-nome').style.display = 'none';
  document.getElementById('btn-excluir').style.display = 'none';
  document.getElementById('modal-fundo').classList.add('aberto');
}

function abrirModalEdicao(id){
  const lead = leads.find(l => l.id === id);
  if (!lead) return;
  idLeadAberto = id;
  document.getElementById('modal-titulo').textContent = lead.nome || 'Editar lead';
  document.getElementById('campo-nome').value = lead.nome || '';
  document.getElementById('campo-telefone').value = lead.telefone ? formatarTelefone(lead.telefone) : '';
  document.getElementById('campo-data').value = lead.dataEntrada || '';
  document.getElementById('campo-etapa').value = lead.etapa;
  document.getElementById('campo-potencial').checked = !!lead.emPotencial;
  document.getElementById('campo-obs').value = lead.observacoes || '';
  document.getElementById('erro-nome').style.display = 'none';
  document.getElementById('btn-excluir').style.display = 'inline-block';
  document.getElementById('modal-fundo').classList.add('aberto');
}

function fecharModal(){
  document.getElementById('modal-fundo').classList.remove('aberto');
}

function salvarLeadAtual(){
  const nome = document.getElementById('campo-nome').value.trim();
  if (!nome) {
    document.getElementById('erro-nome').style.display = 'block';
    return;
  }
  const telefoneDigitado = document.getElementById('campo-telefone').value.trim();
  const telefoneDigits = telefoneDigitado.replace(/\D/g,'');

  const lead = {
    id: idLeadAberto || idNovo(),
    nome,
    telefone: telefoneDigits,
    dataEntrada: document.getElementById('campo-data').value,
    etapa: document.getElementById('campo-etapa').value,
    emPotencial: document.getElementById('campo-potencial').checked,
    observacoes: document.getElementById('campo-obs').value.trim(),
  };
  persistirLead(lead);
  fecharModal();
}

function excluirLeadAtual(){
  if (!idLeadAberto) return;
  if (!confirm('Excluir este lead? Essa ação não pode ser desfeita.')) return;
  persistirExclusao(idLeadAberto);
  fecharModal();
}

// ---------- Início ----------
preencherSelectEtapas();
iniciarLeads();
</script>
</body>
</html>
