<style>

  .resumo .item .rotulo { font-size: 12px; color: var(--text-secondary); }

    display: none; margin-bottom: 14px; padding: 10px 14px;
    background: rgba(212,175,90,0.12); border: 1px solid var(--gold);
    border-radius: 8px; font-size: 13px; color: var(--gold-hover);
  }

  .board { display: flex; gap: 10px; overflow-x: auto; cursor: grab; }
  .board.arrastando-board { cursor: grabbing; user-select: none; }

  .coluna {
    flex: 0 0 190px; display: flex; flex-direction: column;

    overflow: hidden;

  if (!str) return 0;
  const limpo = String(str).replace(/[^\d,.-]/g, '');
  const normalizado = limpo.replace(/\.(?=\d{3}(,|$))/g, '').replace(',', '.');
  const val = parseFloat(normalizado);
  return isNaN(val) ? 0 : val;
}

function leadsFiltrados(){
  const base = leadsNoPeriodo(leads);
  if (!termoBusca) return base;
  const termo = termoBusca.trim().toLowerCase();
  const termoDigits = termo.replace(/\D/g, '');
  return base.filter(l => {
    const nomeMatch = (l.nome || '').toLowerCase().includes(termo);
    const telMatch = termoDigits && (l.telefone || '').includes(termoDigits);
    return nomeMatch || telMatch;
  });
}

function haFiltroAtivo(){
  return !!(termoBusca || filtroDe || filtroAte);
}

function iniciarLeads(){
  db.collection(COLLECTION).get().then(snap => {
    if (snap.empty) {
      const lote = db.batch();
      SEED_LEADS.forEach(l => lote.set(db.collection(COLLECTION).doc(l.id), l));
      lote.commit().catch(err => alert('Não consegui criar os leads iniciais no banco: ' + err.message));
    } else {
      // Migração de segurança: etapas antigas "termo_enviado" e "link_pagamento" saíram do
      // funil. Qualquer lead que ainda estivesse nelas vai para "venda_aprovada" (a etapa
      // anterior que continua existindo), pra não ficar invisível em nenhuma coluna.
      const orfaos = snap.docs.filter(d => ['termo_enviado', 'link_pagamento'].includes(d.data().etapa));
      if (orfaos.length > 0) {
        const lote = db.batch();
        orfaos.forEach(d => lote.update(d.ref, { etapa: 'venda_aprovada' }));
        lote.commit().catch(err => alert('Não consegui migrar leads de etapas antigas: ' + err.message));
      }
    }
  }).catch(err => alert('Não consegui ler os leads do banco: ' + err.message));
  db.collection(COLLECTION).onSnapshot(snap => {
    leads = snap.docs.map(d => d.data());
    renderizarTudo();
  }, err => alert('Perdi a conexão com o banco de dados: ' + err.message));
}

function persistirLead(lead){
  db.collection(COLLECTION).doc(lead.id).set(lead)

function persistirExclusao(id){
  db.collection(COLLECTION).doc(id).delete()
    .catch(err => alert('Não consegui excluir esse lead: ' + err.message));
}

function iniciarConfigFollowup(){
  db.collection(COLLECTION_CONFIG).doc('followup_mensagens').onSnapshot(doc => {
    configFollowup.mensagens = doc.exists ? doc.data() : {};
    if (abaAtiva === 'followup') renderizarBoardFollowup();
  }, err => alert('Não consegui carregar as mensagens de follow-up: ' + err.message));
}

function salvarMensagemFollowup(n, texto){
  db.collection(COLLECTION_CONFIG).doc('followup_mensagens')
    .set({ ['msg' + n]: texto }, { merge: true })
    .then(() => mostrarToast('Mensagem salva'))
    .catch(err => alert('Não consegui salvar essa mensagem: ' + err.message));
}

function formatarTelefone(digits){
  if (!digits) return '';
  const semPais = digits.startsWith('55') ? digits.slice(2) : digits;
  const ddd = semPais.slice(0,2);
  const resto = semPais.slice(2);
  if (resto.length === 9) return `+55 ${ddd} ${resto.slice(0,5)}-${resto.slice(5)}`;
  return `+55 ${ddd} ${resto}`;
}
function linkWhatsapp(digits){
  if (!digits) return null;
  return `https://wa.me/${digits.replace(/\D/g,'')}`;
}
function formatarData(iso){
  if (!iso) return '';
  const [ano, mes, dia] = iso.split('-');
  return `${dia}/${mes}`;
}
function idNovo(){ return 'lead-' + Date.now() + '-' + Math.floor(Math.random()*1000); }

function leadsNoPeriodo(lista){
  if (!filtroDe && !filtroAte) return lista;
  return lista.filter(l => {
    if (!l.dataEntrada) return false;
    if (filtroDe && l.dataEntrada < filtroDe) return false;
    if (filtroAte && l.dataEntrada > filtroAte) return false;
    return true;
  });
}

function renderizarTudo(){
  renderizarResumo();
  renderizarBoard();
  renderizarBoardFollowup();
  renderizarBoardPotencial();
}

function renderizarResumo(){
  const base = leadsNoPeriodo(leads);
  const ativos = base.filter(l => l.etapa !== 'cancelado' && l.etapa !== 'venda_aprovada' && l.etapa !== 'em_producao').length;
  const emProducao = base.filter(l => l.etapa === 'em_producao').length;
  const cancelados = base.filter(l => l.etapa === 'cancelado').length;
  const valorProspectado = base
    .filter(l => l.etapa === 'cotacao_enviada' || l.etapa === 'pedido_aberto')
    .reduce((soma, l) => soma + parseReais(l.valorEstimado), 0);
  document.getElementById('resumo').innerHTML = `
    <div class="item"><span class="valor">${base.length}</span><span class="rotulo">Total de leads</span></div>
    <div class="item"><span class="valor">${ativos}</span><span class="rotulo">Em andamento</span></div>
    <div class="item"><span class="valor">${emProducao}</span><span class="rotulo">Em produção</span></div>
    <div class="item"><span class="valor">${cancelados}</span><span class="rotulo">Cancelados</span></div>
    <div class="item"><span class="valor">${formatarReais(valorProspectado)}</span><span class="rotulo">Valor prospectado</span></div>
  `;
}

function atualizarRotuloFiltro(){
  const el = document.getElementById('rotulo-periodo');
  if (!filtroDe && !filtroAte) { el.textContent = 'Mostrando: todos os períodos'; return; }
  const de = filtroDe ? formatarData(filtroDe) : '...';
  const ate = filtroAte ? formatarData(filtroAte) : '...';
  el.textContent = `Mostrando: ${de} até ${ate}`;
}

function renderizarBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  const listaAtual = leadsFiltrados();
  TODAS_ETAPAS.forEach(etapa => {
    const leadsDaEtapa = listaAtual.filter(l => l.etapa === etapa.id);
    const coluna = document.createElement('div');
    coluna.className = 'coluna' + (etapa.id === 'cancelado' ? ' coluna-cancelado' : '');

    const header = document.createElement('div');
    header.className = 'coluna-header';
    header.style.background = `var(--fase-${etapa.fase})`;
    header.innerHTML = `<span class="nome-etapa">${etapa.nome}</span><span class="contagem">${leadsDaEtapa.length}</span>`;
    coluna.appendChild(header);

    const corpo = document.createElement('div');
    corpo.className = 'coluna-corpo';
    corpo.dataset.etapa = etapa.id;
    corpo.addEventListener('dragover', e => e.preventDefault());
    corpo.addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      const lead = leads.find(l => l.id === id);
      if (lead && lead.etapa !== etapa.id) { lead.etapa = etapa.id; persistirLead(lead); }
    });

    if (leadsDaEtapa.length === 0) {
      corpo.innerHTML = `<div class="vazio">${haFiltroAtivo() ? 'Nada encontrado com esse filtro' : 'Sem leads aqui'}</div>`;
    } else {
      leadsDaEtapa.forEach(lead => corpo.appendChild(criarCard(lead, etapa)));
    }
    coluna.appendChild(corpo);
    board.appendChild(coluna);
  });
}

function mudarAba(nome){
  abaAtiva = nome;
  document.querySelectorAll('.aba').forEach(b => b.classList.toggle('ativa', b.dataset.aba === nome));
  document.getElementById('board').classList.toggle('hidden', nome !== 'funil');
  document.getElementById('board-followup').classList.toggle('hidden', nome !== 'followup');
  document.getElementById('board-potencial').classList.toggle('hidden', nome !== 'potencial');

  const dica = document.getElementById('toolbar-dica');
  if (nome === 'funil') dica.textContent = 'Clique num card pra ver os detalhes, ou arraste entre as colunas pra mudar a etapa.';
  else if (nome === 'followup') dica.textContent = 'Arraste um card pra mudar a tentativa de follow-up, ou clique pra editar o lead. Edite a mensagem de cada coluna no campo acima dela.';
  else dica.textContent = 'Leads marcados como "em potencial", agrupados pela etapa em que estão hoje no funil.';

  if (nome === 'followup') renderizarBoardFollowup();
  if (nome === 'potencial') renderizarBoardPotencial();
}

function renderizarBoardFollowup(){
  const board = document.getElementById('board-followup');
  board.innerHTML = '';
  const listaAtual = leadsFiltrados();

  for (let n = 1; n <= 10; n++) {
    const leadsDoNivel = listaAtual.filter(l => Number(l.followUp) === n);
    const coluna = document.createElement('div');
    coluna.className = 'coluna coluna-followup';

    const header = document.createElement('div');
    header.className = 'coluna-header';
    header.style.background = corFollowup(n);
    header.innerHTML = `<span class="nome-etapa">Follow up ${n}</span><span class="contagem">${leadsDoNivel.length}</span>`;
    coluna.appendChild(header);

    const mensagemBox = document.createElement('textarea');
    mensagemBox.className = 'followup-mensagem';
    mensagemBox.placeholder = `Mensagem da tentativa ${n}...`;
    mensagemBox.value = (configFollowup.mensagens && configFollowup.mensagens['msg' + n]) || '';
    mensagemBox.addEventListener('change', () => salvarMensagemFollowup(n, mensagemBox.value));
    coluna.appendChild(mensagemBox);

    const corpo = document.createElement('div');
    corpo.className = 'coluna-corpo';
    corpo.dataset.followup = n;
    corpo.addEventListener('dragover', e => e.preventDefault());
    corpo.addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      const lead = leads.find(l => l.id === id);
      if (lead && Number(lead.followUp) !== n) { lead.followUp = n; persistirLead(lead); }
    });

    if (leadsDoNivel.length === 0) {
      corpo.innerHTML = `<div class="vazio">${haFiltroAtivo() ? 'Nada encontrado com esse filtro' : 'Sem leads aqui'}</div>`;
    } else {
      leadsDoNivel.forEach(lead => {
        const etapa = TODAS_ETAPAS.find(e => e.id === lead.etapa) || STAGES[0];
        corpo.appendChild(criarCard(lead, etapa));
      });
    }
    coluna.appendChild(corpo);
    board.appendChild(coluna);
  }
}

function renderizarBoardPotencial(){
  const container = document.getElementById('board-potencial');
  container.innerHTML = '';
  const listaAtual = leadsFiltrados().filter(l => l.emPotencial);

  if (listaAtual.length === 0) {
    container.innerHTML = `<div class="vazio">${haFiltroAtivo() ? 'Nada encontrado com esse filtro' : 'Nenhum lead marcado como "em potencial" no momento.'}</div>`;
    return;
  }

  TODAS_ETAPAS.forEach(etapa => {
    const leadsDaEtapa = listaAtual.filter(l => l.etapa === etapa.id);
    if (leadsDaEtapa.length === 0) return;
    const secao = document.createElement('div');
    secao.className = 'secao-potencial';
    secao.innerHTML = `<div class="secao-titulo"><span class="ponto" style="background:var(--fase-${etapa.fase});"></span>${etapa.nome} <span class="contagem">${leadsDaEtapa.length}</span></div>`;
    const linha = document.createElement('div');
    linha.className = 'secao-cards';
    leadsDaEtapa.forEach(lead => linha.appendChild(criarCard(lead, etapa)));
    secao.appendChild(linha);
    container.appendChild(secao);
  });
}

function criarCard(lead, etapa){
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', lead.id));
  card.addEventListener('click', () => abrirModalEdicao(lead.id));

  const nomeExibido = lead.nome && lead.nome.trim() ? lead.nome : formatarTelefone(lead.telefone) || 'Sem nome';
  const link = linkWhatsapp(lead.telefone);

  card.innerHTML = `
    <div class="linha-topo">
      <span class="ponto" style="background:var(--fase-${etapa.fase});"></span>
      <span class="nome">${nomeExibido}</span>
      <span class="data">${formatarData(lead.dataEntrada)}</span>
    </div>
    ${lead.observacoes ? `<div class="obs-preview">${lead.observacoes}</div>` : ''}
    ${lead.valorEstimado ? `<div class="valor-estimado">${lead.valorEstimado}</div>` : ''}
    <div class="linha-baixo">
      ${link ? `<a class="telefone-link" href="${link}" target="_blank" rel="noopener" onclick="event.stopPropagation();">WhatsApp</a>` : '<span></span>'}
      <span class="marcadores">
        ${lead.emPotencial ? '<span class="marcador">Em potencial</span>' : ''}
        ${lead.followUp ? `<span class="marcador-followup" style="background:${corFollowup(lead.followUp)};">Follow-up ${lead.followUp}</span>` : ''}
      </span>
    </div>
  `;
  return card;
}

function preencherSelectEtapas(){
  document.getElementById('campo-etapa').innerHTML = TODAS_ETAPAS.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
}

function preencherSelectFollowup(){
  const opcoes = ['<option value="0">Nenhuma</option>'];
  for (let i = 1; i <= 10; i++) opcoes.push(`<option value="${i}">Follow-up ${i}</option>`);
  document.getElementById('campo-followup').innerHTML = opcoes.join('');
}

function ativarArrastarScroll(board){
  let pressionado = false, arrastando = false, arrastandoCard = false;
  let inicioX = 0, scrollInicial = 0;

  document.addEventListener('dragstart', () => { arrastandoCard = true; });
  document.addEventListener('dragend', () => { arrastandoCard = false; });

  board.addEventListener('mousedown', (e) => {
    if (e.target.closest('.card, button, a, input, select, textarea')) return;
    pressionado = true;
    inicioX = e.pageX;
    scrollInicial = board.scrollLeft;
  });
  window.addEventListener('mousemove', (e) => {
    if (!pressionado || arrastandoCard) return;
    if (!arrastando) {
      if (Math.abs(e.pageX - inicioX) < 5) return; // só ativa depois de um movimento de verdade
      arrastando = true;
      board.classList.add('arrastando-board');
    }
    e.preventDefault();
    board.scrollLeft = scrollInicial - (e.pageX - inicioX);
  });
  window.addEventListener('mouseup', () => {
    pressionado = false;
    arrastando = false;
    board.classList.remove('arrastando-board');
  });
}

  const etapa = document.getElementById('campo-etapa').value;
  const mostrar = etapa === 'cotacao_enviada' || etapa === 'pedido_aberto';
  document.getElementById('linha-valor-estimado').style.display = mostrar ? 'block' : 'none';
}

function abrirModalNovo(){
  idLeadAberto = null;
  document.getElementById('modal-titulo').textContent = 'Adicionar lead';
  document.getElementById('campo-nome').value = '';
  document.getElementById('campo-telefone').value = '';
  document.getElementById('campo-data').value = new Date().toISOString().slice(0,10);
  document.getElementById('campo-etapa').value = 'qualificacao';
  document.getElementById('campo-valor-estimado').value = '';
  document.getElementById('campo-potencial').checked = false;
  document.getElementById('campo-followup').value = '0';
  document.getElementById('campo-obs').value = '';
  document.getElementById('erro-nome').style.display = 'none';

function abrirModalEdicao(id){
  const lead = leads.find(l => l.id === id);
  if (!lead) return;
  idLeadAberto = id;
  document.getElementById('modal-titulo').textContent = lead.nome || 'Editar lead';
  document.getElementById('campo-nome').value = lead.nome || '';
  document.getElementById('campo-telefone').value = lead.telefone ? formatarTelefone(lead.telefone) : '';
  document.getElementById('campo-data').value = lead.dataEntrada || '';
  document.getElementById('campo-etapa').value = lead.etapa;
  document.getElementById('campo-valor-estimado').value = lead.valorEstimado || '';
  document.getElementById('campo-potencial').checked = !!lead.emPotencial;
  document.getElementById('campo-followup').value = String(lead.followUp || 0);
  document.getElementById('campo-obs').value = lead.observacoes || '';
  document.getElementById('erro-nome').style.display = 'none';
  document.getElementById('btn-excluir').style.display = 'inline-block';
  atualizarVisibilidadeValorEstimado();
  document.getElementById('modal-fundo').classList.remove('hidden');
}

function fecharModal(){ document.getElementById('modal-fundo').classList.add('hidden'); }

function mostrarToast(msg){
  const t = document.getElementById('toast-el');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function salvarLeadAtual(){
  const nome = document.getElementById('campo-nome').value.trim();
  if (!nome) { document.getElementById('erro-nome').style.display = 'block'; return; }
  const telefoneDigits = document.getElementById('campo-telefone').value.trim().replace(/\D/g,'');

  const lead = {
    id: idLeadAberto || idNovo(),
    nome,
    telefone: telefoneDigits,
    dataEntrada: document.getElementById('campo-data').value,
    etapa: document.getElementById('campo-etapa').value,
    valorEstimado: document.getElementById('campo-valor-estimado').value.trim(),
    emPotencial: document.getElementById('campo-potencial').checked,
    followUp: Number(document.getElementById('campo-followup').value) || 0,
    observacoes: document.getElementById('campo-obs').value.trim(),
  };
  persistirLead(lead);
  mostrarToast(idLeadAberto ? 'Lead atualizado' : 'Lead adicionado');
  fecharModal();
}

function excluirLeadAtual(){
  if (!idLeadAberto) return;
  if (!confirm('Excluir este lead? Essa ação não pode ser desfeita.')) return;
  persistirExclusao(idLeadAberto);
  mostrarToast('Lead excluído');
  fecharModal();
}

function abrirRelatorio(){
  const base = leadsNoPeriodo(leads);
  const total = base.length || 1;

  const porEtapa = TODAS_ETAPAS.map(etapa => ({
    etapa,
    qtd: base.filter(l => l.etapa === etapa.id).length
  }));

  const hoje = new Date();
  hoje.setHours(0,0,0,0);
  const travados = porEtapa
    .filter(p => p.qtd > 0 && p.etapa.id !== 'cancelado')
    .map(p => {
      const leadsDaEtapa = base.filter(l => l.etapa === p.etapa.id);
      const maisAntigo = leadsDaEtapa.reduce((antigo, l) => {
        if (!l.dataEntrada) return antigo;
        return (!antigo || l.dataEntrada < antigo) ? l.dataEntrada : antigo;
      }, null);
      const diasParado = maisAntigo ? Math.floor((hoje - new Date(maisAntigo + 'T00:00:00')) / 86400000) : null;
      return { ...p, diasParado };
    })
    .sort((a, b) => b.qtd - a.qtd)
    .slice(0, 5);

  const valorCotacao = base.filter(l => l.etapa === 'cotacao_enviada').reduce((s, l) => s + parseReais(l.valorEstimado), 0);
  const valorPedido = base.filter(l => l.etapa === 'pedido_aberto').reduce((s, l) => s + parseReais(l.valorEstimado), 0);
  const valorEsfriado = base.filter(l => l.etapa === 'cotacao_enviada' && Number(l.followUp) > 0).reduce((s, l) => s + parseReais(l.valorEstimado), 0);

  ultimoRelatorio = { porEtapa, total, travados, valorCotacao, valorPedido, valorEsfriado };

  const textoPeriodo = (filtroDe || filtroAte)
    ? `Período: ${filtroDe ? formatarData(filtroDe) : '...'} até ${filtroAte ? formatarData(filtroAte) : '...'}`
    : 'Período: todos os leads cadastrados';
  document.getElementById('relatorio-periodo').textContent = textoPeriodo;

  desenharPizza(porEtapa, total);

  document.getElementById('relatorio-legenda').innerHTML = porEtapa
    .filter(p => p.qtd > 0)
    .map(p => `<div class="legenda-item"><span class="legenda-cor" style="background:var(--fase-${p.etapa.fase});"></span>${p.etapa.nome}: ${p.qtd} (${Math.round(p.qtd / total * 100)}%)</div>`)
    .join('');

  document.getElementById('relatorio-travados').innerHTML = travados.length
    ? travados.map(t => `<div class="relatorio-linha">${t.etapa.nome}: ${t.qtd} lead${t.qtd > 1 ? 's' : ''}${t.diasParado !== null ? `, o mais antigo há ${t.diasParado} dia${t.diasParado === 1 ? '' : 's'}` : ''}</div>`).join('')
    : '<div class="relatorio-linha">Nada acumulado fora do comum nesse período.</div>';

  document.getElementById('relatorio-valores').innerHTML = `
    <div class="relatorio-linha">Em cotação enviada: ${formatarReais(valorCotacao)}</div>
    <div class="relatorio-linha">Em pedido aberto (aprovado, não fechado): ${formatarReais(valorPedido)}</div>
    <div class="relatorio-linha">Cotações já em follow-up, esfriando: ${formatarReais(valorEsfriado)}</div>
  `;

  const sugestoes = [];
  const maiorTravado = travados[0];
  if (maiorTravado && maiorTravado.qtd >= 3) sugestoes.push(`"${maiorTravado.etapa.nome}" concentra o maior número de leads parados, vale priorizar esse grupo.`);
  if (valorEsfriado > 0) sugestoes.push(`${formatarReais(valorEsfriado)} em cotações já entraram em follow-up sem fechar, esse é o valor mais urgente de retomar.`);
  if (valorPedido > 0) sugestoes.push(`${formatarReais(valorPedido)} em pedidos aprovados ainda não fechados, considere confirmar esses com prioridade.`);
  if (sugestoes.length === 0) sugestoes.push('Sem pontos de atenção fora do comum nesse período.');
  document.getElementById('relatorio-sugestoes').innerHTML = sugestoes.map(s => `<div class="relatorio-linha">${s}</div>`).join('');

  document.getElementById('modal-relatorio-fundo').classList.remove('hidden');
}

function fecharRelatorio(){ document.getElementById('modal-relatorio-fundo').classList.add('hidden'); }

function desenharPizza(porEtapa, total){
  const canvas = document.getElementById('relatorio-pizza');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2, raio = Math.min(cx, cy) - 6;
  let anguloInicial = -Math.PI / 2;
  const estilos = getComputedStyle(document.documentElement);

  const comLeads = porEtapa.filter(p => p.qtd > 0);
  if (comLeads.length === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, raio, 0, Math.PI * 2);
    ctx.fillStyle = estilos.getPropertyValue('--border').trim() || '#3d3833';
    ctx.fill();
    return;
  }

  comLeads.forEach(p => {
    const fatia = (p.qtd / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, raio, anguloInicial, anguloInicial + fatia);
    ctx.closePath();
    ctx.fillStyle = estilos.getPropertyValue(`--fase-${p.etapa.fase}`).trim() || '#999';
    ctx.fill();
    anguloInicial += fatia;
  });
}

function baixarRelatorioPDF(){
  if (!ultimoRelatorio || !window.jspdf) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const margem = 40;
  let y = margem;

  doc.setFontSize(16);
  doc.text('Relatorio de Leads - Spielvogel Joias', margem, y); y += 20;
  doc.setFontSize(10);
  doc.text(document.getElementById('relatorio-periodo').textContent, margem, y); y += 24;

  const canvas = document.getElementById('relatorio-pizza');
  const imgData = canvas.toDataURL('image/png');
  doc.addImage(imgData, 'PNG', margem, y, 130, 130);

  let yLegenda = y;
  doc.setFontSize(9);
  ultimoRelatorio.porEtapa.filter(p => p.qtd > 0).forEach(p => {
    doc.text(`${p.etapa.nome}: ${p.qtd} (${Math.round(p.qtd / ultimoRelatorio.total * 100)}%)`, margem + 150, yLegenda + 10);
    yLegenda += 14;
  });
  y += 150;

  doc.setFontSize(12);
  doc.text('Onde os leads estao travando', margem, y); y += 16;
  doc.setFontSize(9);
  if (ultimoRelatorio.travados.length === 0) {
    doc.text('Nada acumulado fora do comum nesse periodo.', margem, y); y += 14;
  } else {
    ultimoRelatorio.travados.forEach(t => {
      doc.text(`${t.etapa.nome}: ${t.qtd} lead(s)${t.diasParado !== null ? `, o mais antigo ha ${t.diasParado} dia(s)` : ''}`, margem, y);
      y += 14;
    });
  }
  y += 8;

  doc.setFontSize(12);
  doc.text('Valor parado (R$)', margem, y); y += 16;
  doc.setFontSize(9);
  doc.text(`Em cotacao enviada: ${formatarReais(ultimoRelatorio.valorCotacao)}`, margem, y); y += 14;
  doc.text(`Em pedido aberto: ${formatarReais(ultimoRelatorio.valorPedido)}`, margem, y); y += 14;
  doc.text(`Cotacoes esfriando em follow-up: ${formatarReais(ultimoRelatorio.valorEsfriado)}`, margem, y); y += 20;

  doc.setFontSize(12);
  doc.text('Sugestoes', margem, y); y += 16;
  doc.setFontSize(9);
  document.querySelectorAll('#relatorio-sugestoes .relatorio-linha').forEach(el => {
    const linhas = doc.splitTextToSize(el.textContent, 500);
    doc.text(linhas, margem, y);
    y += 14 * linhas.length;
  });

  doc.save(`relatorio-leads-${new Date().toISOString().slice(0,10)}.pdf`);
}

ativarArrastarScroll(document.getElementById('board-followup'));

document.getElementById('campo-busca').addEventListener('input', (e) => {
  termoBusca = e.target.value;
  renderizarBoard();
  renderizarBoardFollowup();
  renderizarBoardPotencial();
});

document.getElementById('campo-etapa').addEventListener('change', atualizarVisibilidadeValorEstimado);

document.getElementById('filtro-de').addEventListener('change', (e) => {
  filtroDe = e.target.value;
  renderizarTudo();
  atualizarRotuloFiltro();
});
document.getElementById('filtro-ate').addEventListener('change', (e) => {
  filtroAte = e.target.value;
  renderizarTudo();
  atualizarRotuloFiltro();
});
document.getElementById('btn-limpar-filtro').addEventListener('click', () => {
  filtroDe = '';
  filtroAte = '';
  document.getElementById('filtro-de').value = '';
  document.getElementById('filtro-ate').value = '';
  renderizarTudo();
  atualizarRotuloFiltro();
});
document.getElementById('btn-gerar-relatorio').addEventListener('click', abrirRelatorio);

iniciarLeads();
iniciarConfigFollowup();
</script>
