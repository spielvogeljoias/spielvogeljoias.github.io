<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielvogel Joias — CRM de Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141210;
    --bg-elevated: #1c1a17;
    --gold: #C9A24B;
    --gold-soft: #8f7a4d;
    --cream: #F3EDE1;
    --cream-dim: #b8b0a0;
    --line: #2c2822;
    --danger: #b5544a;
    --amber: #c9963f;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font-family: var(--font-body); min-height: 100vh; }

  header { padding: 28px 20px 22px; text-align: center; border-bottom: 1px solid var(--line); }
  .logo-placeholder { font-family: var(--font-display); font-size: 30px; letter-spacing: 3px; color: var(--gold); font-weight: 500; }
  .logo-sub { font-size: 11px; letter-spacing: 4px; color: var(--cream-dim); text-transform: uppercase; margin-top: 4px; }

  main { max-width: 1600px; margin: 0 auto; padding: 20px 16px 60px; }

  .toolbar { display: flex; justify-content: center; margin-bottom: 20px; }
  .btn {
    font-family: var(--font-body); font-size: 14px; font-weight: 500; border: 1px solid var(--gold);
    background: transparent; color: var(--gold); padding: 10px 22px; border-radius: 3px; cursor: pointer;
    letter-spacing: 0.5px; transition: background 0.15s, color 0.15s;
  }
  .btn:hover { background: var(--gold); color: var(--bg); }
  .btn-solid { background: var(--gold); color: var(--bg); }
  .btn-solid:hover { background: var(--gold-soft); }
  .btn-text { border: none; background: none; color: var(--cream-dim); font-size: 13px; padding: 4px 8px; cursor: pointer; }
  .btn-text:hover { color: var(--gold); background: none; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: var(--cream); }

  .board {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 12px;
    scroll-snap-type: x proximity;
  }
  .column {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 12px;
    min-height: 120px;
    min-width: 260px;
    max-width: 260px;
    flex-shrink: 0;
    scroll-snap-align: start;
  }
  .column-header { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 2px; }
  .column-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .column-title { font-family: var(--font-display); font-size: 17px; color: var(--gold); text-align: center; margin: 0; letter-spacing: 0.3px; }
  .column-count { text-align: center; font-size: 11px; color: var(--cream-dim); margin-bottom: 12px; letter-spacing: 1px; }

  .card {
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 12px;
    margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--gold-soft); }
  .card-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .card-client { font-family: var(--font-display); font-size: 17px; color: var(--cream); margin: 0 0 4px; }
  .recurring-badge { font-size: 13px; }
  .contact-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px;
    border-radius: 3px; margin-bottom: 6px; border: 1px solid;
  }
  .badge-danger { color: var(--danger); border-color: var(--danger); background: rgba(181,84,74,0.12); }
  .badge-amber { color: var(--amber); border-color: var(--amber); background: rgba(201,150,63,0.12); }
  .badge-neutral { color: var(--cream-dim); border-color: var(--line); background: rgba(255,255,255,0.03); }
  .card-request {
    font-size: 12px; color: var(--cream-dim); margin: 0 0 8px;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-budget { font-size: 12px; color: var(--gold-soft); margin: 0 0 8px; }
  .card-next-step {
    font-size: 11px; color: var(--gold); font-style: italic; margin: 0 0 8px;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-actions { border-top: 1px solid var(--line); padding-top: 8px; }
  .wa-link {
    display: inline-block; font-size: 12px; color: var(--gold); text-decoration: none;
    border: 1px solid var(--line); padding: 4px 10px; border-radius: 3px;
  }
  .wa-link:hover { border-color: var(--gold); }

  .empty-column { text-align: center; color: var(--cream-dim); font-size: 12px; padding: 20px 6px; opacity: 0.6; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center;
    justify-content: center; padding: 16px; z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 8px; width: 100%;
    max-width: 460px; max-height: 90vh; overflow-y: auto; padding: 24px;
  }
  .modal h2 { font-family: var(--font-display); color: var(--gold); margin: 0 0 18px; font-size: 22px; text-align: center; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--cream-dim); margin-bottom: 5px; letter-spacing: 0.3px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--cream);
    padding: 9px 10px; border-radius: 4px; font-family: var(--font-body); font-size: 14px;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--gold); }
  .field textarea { resize: vertical; min-height: 50px; }
  .field input[type="date"] { color-scheme: dark; }
  .field-checkbox { display: flex; align-items: center; gap: 8px; }
  .field-checkbox input { width: auto; }
  .field-checkbox label { margin-bottom: 0; }

  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--gold);
    color: var(--bg); padding: 10px 20px; border-radius: 4px; font-size: 13px; font-weight: 500;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo-placeholder">SPIELVOGEL JOIAS</div>
  <div class="logo-sub">CRM de Leads</div>
</header>

<main>
  <div class="toolbar">
    <button class="btn btn-solid" id="addBtn">+ Novo Lead</button>
  </div>
  <div class="board" id="board"></div>
</main>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Novo Lead</h2>
    <input type="hidden" id="leadId">

    <div class="field">
      <label>Nome do cliente</label>
      <input type="text" id="fieldName" placeholder="Ex: Camila Ferreira">
    </div>

    <div class="field">
      <label>Contato (WhatsApp, com DDD)</label>
      <input type="text" id="fieldPhone" placeholder="Ex: 47 99999-9999">
    </div>

    <div class="field">
      <label>Estágio</label>
      <select id="fieldStage"></select>
    </div>

    <div class="field">
      <label>O que a pessoa quer</label>
      <textarea id="fieldRequest" placeholder="Modelo, pedra, referência, ocasião..."></textarea>
    </div>

    <div class="field">
      <label>Orçamento mencionado</label>
      <input type="text" id="fieldBudget" placeholder="Ex: até R$ 4.000,00">
    </div>

    <div class="field">
      <label>Data do último contato</label>
      <input type="date" id="fieldLastContact">
    </div>

    <div class="field">
      <label>Próximo passo</label>
      <input type="text" id="fieldNextStep" placeholder="Ex: mandar 3 referências de anel oval">
    </div>

    <div class="field">
      <label>Anotações</label>
      <textarea id="fieldNotes" placeholder="Resumo da conversa, combinados..."></textarea>
    </div>

    <div class="field field-checkbox">
      <input type="checkbox" id="fieldRecurring">
      <label for="fieldRecurring">⭐ Cliente recorrente</label>
    </div>

    <div class="modal-actions">
      <button class="btn-text btn-danger" id="deleteBtn" style="display:none;">Excluir</button>
      <div style="flex:1;"></div>
      <button class="btn-text" id="cancelBtn">Cancelar</button>
      <button class="btn btn-solid" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* Mesmo projeto Firebase dos outros dois paineis, só que numa coleção
   nova ("leads"), então não precisa criar nada no Firebase. */
const firebaseConfig = {
  apiKey: "AIzaSyBY2aOX2FSTdjdOH9Nqyi4lAVkfsLws9ek",
  authDomain: "spielvogel-painel.firebaseapp.com",
  projectId: "spielvogel-painel",
  storageBucket: "spielvogel-painel.firebasestorage.app",
  messagingSenderId: "368754911719",
  appId: "1:368754911719:web:c452ad8cca48410de33542"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = "leads";

/* As 10 etapas do funil, na ordem. Cor e emoji batem com a legenda
   visual (legenda-crm-leads.png) pra servir de referência única. */
const STAGES = [
  { key: "novo_lead",             emoji: "🆕", label: "Novo lead",               color: "#9AA15C" },
  { key: "entendendo_pedido",      emoji: "🔍", label: "Entendendo o pedido",     color: "#6FB8DE" },
  { key: "inspiracoes_enviadas",   emoji: "📸", label: "Inspirações enviadas",    color: "#9B7FD4" },
  { key: "esfriou_pos_inspiracao", emoji: "❄️", label: "Esfriou pós-inspiração",  color: "#E0954D" },
  { key: "desenho_desenvolvimento",emoji: "🖊️", label: "Desenho em desenvolvimento", color: "#3B5FA0" },
  { key: "desenho_aprovacao",      emoji: "🖼️", label: "Desenho em aprovação",    color: "#4FBEBE" },
  { key: "cotacao_enviada",        emoji: "💰", label: "Cotação enviada",         color: "#4A79C9" },
  { key: "esfriou_pos_cotacao",    emoji: "❄️", label: "Esfriou pós-cotação",     color: "#C1554A" },
  { key: "negociando_ajustes",     emoji: "🤝", label: "Negociando ajustes",      color: "#C9A24B" },
  { key: "sinal_pago",             emoji: "✅", label: "Sinal pago",              color: "#6E9B4F" },
];

const boardEl = document.getElementById("board");
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const leadIdInput = document.getElementById("leadId");
const fieldName = document.getElementById("fieldName");
const fieldPhone = document.getElementById("fieldPhone");
const fieldStage = document.getElementById("fieldStage");
const fieldRequest = document.getElementById("fieldRequest");
const fieldBudget = document.getElementById("fieldBudget");
const fieldLastContact = document.getElementById("fieldLastContact");
const fieldNextStep = document.getElementById("fieldNextStep");
const fieldNotes = document.getElementById("fieldNotes");
const fieldRecurring = document.getElementById("fieldRecurring");
const deleteBtn = document.getElementById("deleteBtn");
const toastEl = document.getElementById("toast");

let currentLeads = [];

// Popula o <select> de estágio uma vez, na carga da página
STAGES.forEach(s => {
  const opt = document.createElement("option");
  opt.value = s.key;
  opt.textContent = `${s.emoji} ${s.label}`;
  fieldStage.appendChild(opt);
});

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function stageInfo(key) {
  return STAGES.find(s => s.key === key) || STAGES[0];
}

// Link direto pro WhatsApp (wa.me), sem precisar de API paga.
// Assume DDD+numero brasileiro se vier sem o 55 na frente.
function buildWaLink(phone) {
  if (!phone) return "";
  let digits = String(phone).replace(/\D/g, "");
  if (!digits) return "";
  if (!digits.startsWith("55") && (digits.length === 10 || digits.length === 11)) {
    digits = "55" + digits;
  }
  return "https://wa.me/" + digits;
}

function daysSinceContact(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(dateStr + "T00:00:00");
  return Math.round((today - d) / 86400000);
}

// Badge de "há quantos dias sem contato": quanto mais tempo parado,
// mais chamativo, pra puxar sua atenção pros leads esquecidos primeiro.
function contactBadgeHtml(lead) {
  const days = daysSinceContact(lead.lastContact);
  if (days === null) return "";
  let cls = "badge-neutral";
  if (days >= 5) cls = "badge-danger";
  else if (days >= 2) cls = "badge-amber";
  let label;
  if (days <= 0) label = "hoje";
  else if (days === 1) label = "há 1 dia";
  else label = `há ${days} dias`;
  return `<span class="contact-badge ${cls}">🕓 ${label}</span>`;
}

function renderBoard() {
  boardEl.innerHTML = "";
  STAGES.forEach(stage => {
    const colEl = document.createElement("div");
    colEl.className = "column";

    const leadsInStage = currentLeads
      .filter(l => l.stage === stage.key)
      .sort((a, b) => {
        const da = daysSinceContact(a.lastContact);
        const db_ = daysSinceContact(b.lastContact);
        if (da === null && db_ === null) return 0;
        if (da === null) return 1;
        if (db_ === null) return -1;
        return db_ - da; // mais dias parado primeiro
      });

    colEl.innerHTML = `
      <div class="column-header">
        <span class="column-dot" style="background:${stage.color};"></span>
        <p class="column-title">${stage.emoji} ${stage.label}</p>
      </div>
      <div class="column-count">${leadsInStage.length} ${leadsInStage.length === 1 ? "lead" : "leads"}</div>
    `;

    if (leadsInStage.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-column";
      empty.textContent = "Nenhum lead aqui";
      colEl.appendChild(empty);
    }

    leadsInStage.forEach(lead => {
      const cardEl = document.createElement("div");
      cardEl.className = "card";
      const waLink = buildWaLink(lead.phone);
      cardEl.innerHTML = `
        <div class="card-header-row">
          <p class="card-client">${lead.name || "Sem nome"}</p>
          ${lead.recurring ? '<span class="recurring-badge">⭐</span>' : ""}
        </div>
        ${contactBadgeHtml(lead)}
        ${lead.request ? `<p class="card-request">${lead.request}</p>` : ""}
        ${lead.budget ? `<p class="card-budget">${lead.budget}</p>` : ""}
        ${lead.nextStep ? `<p class="card-next-step">→ ${lead.nextStep}</p>` : ""}
        <div class="card-actions">
          ${waLink ? `<a class="wa-link" href="${waLink}" target="_blank" rel="noopener">💬 Abrir WhatsApp</a>` : ""}
        </div>
      `;
      const waEl = cardEl.querySelector(".wa-link");
      if (waEl) waEl.addEventListener("click", (e) => e.stopPropagation());
      cardEl.addEventListener("click", () => openEditModal(lead));
      colEl.appendChild(cardEl);
    });

    boardEl.appendChild(colEl);
  });
}

function openAddModal() {
  modalTitle.textContent = "Novo Lead";
  leadIdInput.value = "";
  fieldName.value = "";
  fieldPhone.value = "";
  fieldStage.value = STAGES[0].key;
  fieldRequest.value = "";
  fieldBudget.value = "";
  fieldLastContact.value = new Date().toISOString().slice(0, 10);
  fieldNextStep.value = "";
  fieldNotes.value = "";
  fieldRecurring.checked = false;
  deleteBtn.style.display = "none";
  modalOverlay.classList.remove("hidden");
}

function openEditModal(lead) {
  modalTitle.textContent = "Editar Lead";
  leadIdInput.value = lead.id;
  fieldName.value = lead.name || "";
  fieldPhone.value = lead.phone || "";
  fieldStage.value = lead.stage || STAGES[0].key;
  fieldRequest.value = lead.request || "";
  fieldBudget.value = lead.budget || "";
  fieldLastContact.value = lead.lastContact || "";
  fieldNextStep.value = lead.nextStep || "";
  fieldNotes.value = lead.notes || "";
  fieldRecurring.checked = !!lead.recurring;
  deleteBtn.style.display = "inline-block";
  modalOverlay.classList.remove("hidden");
}

function closeModal() {
  modalOverlay.classList.add("hidden");
}

document.getElementById("addBtn").addEventListener("click", openAddModal);
document.getElementById("cancelBtn").addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => {
  if (e.target === modalOverlay) closeModal();
});

document.getElementById("saveBtn").addEventListener("click", async () => {
  const id = leadIdInput.value;
  const name = fieldName.value.trim();

  if (!name) {
    showToast("Preencha ao menos o nome do lead");
    return;
  }

  const saveBtnEl = document.getElementById("saveBtn");
  saveBtnEl.disabled = true;
  saveBtnEl.textContent = "Salvando...";

  try {
    const data = {
      name,
      phone: fieldPhone.value.trim(),
      stage: fieldStage.value,
      request: fieldRequest.value.trim(),
      budget: fieldBudget.value.trim(),
      lastContact: fieldLastContact.value || "",
      nextStep: fieldNextStep.value.trim(),
      notes: fieldNotes.value.trim(),
      recurring: fieldRecurring.checked,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (id) {
      await db.collection(COLLECTION).doc(id).update(data);
      showToast("Lead atualizado");
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection(COLLECTION).add(data);
      showToast("Lead criado");
    }

    closeModal();
  } catch (err) {
    console.error(err);
    showToast("Erro ao salvar, tenta de novo");
  } finally {
    saveBtnEl.disabled = false;
    saveBtnEl.textContent = "Salvar";
  }
});

deleteBtn.addEventListener("click", async () => {
  const id = leadIdInput.value;
  if (!id) return;
  if (!confirm("Excluir este lead? Essa ação não pode ser desfeita.")) return;
  await db.collection(COLLECTION).doc(id).delete();
  showToast("Lead excluído");
  closeModal();
});

db.collection(COLLECTION).orderBy("createdAt", "asc").onSnapshot(snapshot => {
  currentLeads = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderBoard();
}, err => {
  console.error("Erro ao carregar dados:", err);
  boardEl.innerHTML = '<p style="text-align:center;color:#b5544a;">Erro ao conectar com o banco de dados.</p>';
});
</script>

</body>
</html>
