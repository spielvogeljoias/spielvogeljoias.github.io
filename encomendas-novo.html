<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spielvogel Joias · Painel de Encomendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="estilo.css">
<script src="tema.js"></script>
<style>
  /* ============================================================
     PAINEL DE ENCOMENDAS · cores próprias dos materiais e alertas
     ============================================================ */
  :root {
    --m-tenho: #5b9be0; --m-comprar: #e0786b; --m-comprado: #e0a33c; --m-recebido: #4fb37c;
    --alerta-vermelho-bg: rgba(224,120,107,0.14); --alerta-vermelho-tx: #f0a397;
    --alerta-ambar-bg: rgba(224,163,60,0.15); --alerta-ambar-tx: #f0c27a;
    --ok-bg: rgba(79,179,124,0.15); --ok-tx: #8fd6ac;
    --neutro-bg: rgba(255,255,255,0.06);
  }
  :root[data-theme="light"] {
    --m-tenho: #2f6fb0; --m-comprar: #c63a2f; --m-comprado: #b8770f; --m-recebido: #2e8b57;
    --alerta-vermelho-bg: #fde3df; --alerta-vermelho-tx: #8f2018;
    --alerta-ambar-bg: #fbebcb; --alerta-ambar-tx: #6b4300;
    --ok-bg: #ddf1e5; --ok-tx: #1f6b42;
    --neutro-bg: #eeeeea;
  }

  main { max-width: 1680px; margin: 0 auto; padding: 22px 24px 90px; }
  button { font-family: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Topo da página */
  .topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px 20px; flex-wrap: wrap; margin-bottom: 14px; }
  .topo .page-head { margin: 0; }
  .topo-acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .visoes { display: flex; gap: 4px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .visoes button { border: 0; background: none; color: var(--text-secondary); font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 9px; cursor: pointer; min-height: 38px; }
  .visoes button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
  .visoes .qtd { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; font-size: 11px; line-height: 18px; background: var(--danger); color: #fff; }
  .busca { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-elevated); min-width: 220px; }
  .busca input { border: 0; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 14px; flex: 1; min-width: 0; }
  .busca svg { flex: none; color: var(--text-muted); }
  .btn-icone { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; }

  /* Barra de atenção */
  .atencao { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 4px 0 10px; }
  .atencao-titulo { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-right: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; border: 2px solid transparent; cursor: pointer; background: var(--neutro-bg); color: var(--text); }
  .chip .ponto { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip.vermelho { background: var(--alerta-vermelho-bg); color: var(--alerta-vermelho-tx); }
  .chip.vermelho .ponto { background: var(--m-comprar); }
  .chip.ambar { background: var(--alerta-ambar-bg); color: var(--alerta-ambar-tx); }
  .chip.ambar .ponto { background: var(--m-comprado); }
  .chip.forte { background: var(--danger); color: #fff; }
  .chip.ok { background: var(--ok-bg); color: var(--ok-tx); cursor: default; }
  .chip.ouro { background: transparent; border-color: var(--gold-soft); color: var(--gold); }
  .chip[aria-pressed="true"] { border-color: var(--text); }
  .atencao-dica { font-size: 12px; color: var(--text-muted); }

  .legenda { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
  .legenda b { font-weight: 600; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }

  /* Bolinhas de material (cor + forma, para não depender só da cor) */
  .bol { width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; display: inline-grid; place-items: center; flex: none; color: #fff; }
  .bol svg { width: 10px; height: 10px; display: block; }
  .bol-tenho { background: var(--m-tenho); }
  .bol-comprar { background: var(--m-comprar); }
  .bol-comprado { background: transparent; border: 3px solid var(--m-comprado); }
  .bol-recebido { background: var(--m-recebido); }
  .bol-btn { width: 30px; height: 30px; border: 0; background: none; padding: 0; display: grid; place-items: center; border-radius: 8px; cursor: pointer; }
  .bol-btn:hover { background: var(--neutro-bg); }
  .bol-btn:focus-visible { outline: 2px solid var(--gold); }

  /* Quadro */
  .quadro { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)) minmax(190px, 0.85fr); gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 6px; }
  .coluna { display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; padding: 12px 10px 10px; min-height: 120px; }
  .coluna.sobre { border-color: var(--gold); }
  .coluna-topo { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 2px; }
  .coluna-titulo { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.1; color: var(--text); }
  .coluna-qtd { font-size: 12px; font-weight: 600; color: var(--text-secondary); background: var(--neutro-bg); border-radius: 999px; padding: 1px 9px; }
  .coluna-dica { font-size: 11.5px; color: var(--text-muted); padding: 0 4px; margin-top: -4px; }
  .vazio { text-align: center; color: var(--text-muted); font-size: 12.5px; padding: 14px 4px; }

  .card { background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 12px; padding: 9px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: opacity .15s, border-color .15s; }
  .card:hover { border-color: var(--gold-soft); }
  .card.vermelho { border-color: var(--m-comprar); }
  .card.ambar { border-color: var(--m-comprado); }
  .card.apagado { opacity: 0.28; }
  .card.destaque { box-shadow: 0 0 0 2px var(--gold); }
  .card-top { display: flex; align-items: center; gap: 9px; }
  .card-foto { width: 44px; height: 44px; flex: none; border-radius: 9px; overflow: hidden; border: 0; padding: 0; background: var(--neutro-bg); display: grid; place-items: center; color: var(--text-muted); cursor: zoom-in; }
  .card-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-foto.sem { cursor: pointer; }
  .card-txt { flex: 1; min-width: 0; }
  .card-nome { display: block; font-weight: 700; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-sub { display: block; font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prazo { flex: none; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 3px 7px; background: var(--neutro-bg); color: var(--text-secondary); white-space: nowrap; }
  .prazo.vermelho { background: var(--danger); color: #fff; }
  .prazo.ambar { background: var(--alerta-ambar-bg); color: var(--alerta-ambar-tx); }
  .card-mats { display: flex; align-items: center; flex-wrap: wrap; gap: 0; margin: -2px 0 -2px -6px; }
  .card-mats .resumo { font-size: 11.5px; color: var(--text-secondary); margin-left: 4px; }
  .aviso-linha { font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 3px 8px; align-self: flex-start; }
  .aviso-linha.vermelho { background: var(--alerta-vermelho-bg); color: var(--alerta-vermelho-tx); }
  .aviso-linha.ambar { background: var(--alerta-ambar-bg); color: var(--alerta-ambar-tx); }
  .aviso-linha.ok { background: var(--ok-bg); color: var(--ok-tx); }
  .aviso-linha.neutro { background: var(--neutro-bg); color: var(--text-secondary); font-weight: 500; }
  .aviso-linha.mini { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; }
  .aviso-linha.revisar { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px dashed var(--gold-soft); color: var(--gold); font-weight: 600; }

  /* Materiais com nome, direto no cartão */
  .mat-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .mat-chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; min-height: 26px; padding: 2px 8px 2px 4px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
  .mat-chip:hover { border-color: var(--gold-soft); color: var(--text); }
  .mat-chip:focus-visible { outline: 2px solid var(--gold); }
  .mat-chip .bol { width: 14px; height: 14px; }
  .mat-chip .bol svg { width: 9px; height: 9px; }
  .mat-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
  .mat-chip.st-comprar { color: var(--alerta-vermelho-tx); }

  /* Etapas em miniatura, direto no cartão */
  .mini-et { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
  .mini-et li { display: flex; flex-direction: column; gap: 2px; font-size: 9.5px; font-weight: 600; color: var(--text-muted); text-align: center; letter-spacing: .01em; }
  .mini-et li::before { content: ""; height: 4px; border-radius: 2px; background: var(--border); }
  .mini-et li.ok { color: var(--ok-tx); }
  .mini-et li.ok::before { background: var(--m-recebido); }
  .mini-et li.agora { color: var(--gold); }
  .mini-et li.agora::before { background: var(--gold); }
  .mini-et li.falta { color: var(--alerta-vermelho-tx); }
  .mini-et li.falta::before { background: repeating-linear-gradient(90deg, var(--m-comprar) 0 3px, transparent 3px 5px); }
  .card-meta { font-size: 11px; color: var(--text-muted); }
  .mat-chip.mais { padding: 2px 9px; border-style: dashed; color: var(--gold); }
  button.aviso-linha { font-family: inherit; cursor: pointer; text-align: left; }
  button.aviso-linha.revisar:hover { background: var(--alerta-ambar-bg); }
  .mini-et .mini-btn { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .qa { border: 1px solid var(--gold-soft); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); cursor: default; }
  .qa-tit { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--gold); }
  .qa-sug { display: flex; flex-wrap: wrap; gap: 4px; }
  .qa-sug button, .qa-acoes button, .qa-fechar { font: inherit; font-size: 11.5px; font-weight: 600; border: 1px solid var(--border); background: var(--bg-elevated-2); color: var(--text-secondary); border-radius: 999px; padding: 4px 9px; cursor: pointer; min-height: 28px; }
  .qa-sug button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .qa-input { width: 100%; background: var(--bg-elevated-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12.5px; }
  .qa-input:focus { outline: none; border-color: var(--gold); }
  .qa-acoes { display: flex; gap: 4px; flex-wrap: wrap; }
  .qa-acoes button { display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; color: var(--text); }
  .qa-acoes button:hover, .qa-sug button:hover { border-color: var(--gold-soft); }
  .qa-acoes .bol { width: 13px; height: 13px; }
  .qa-fechar { align-self: flex-end; border-radius: 8px; }

  /* Recorte da foto do contrato */
  .modal.recorte { max-width: 900px; }
  .rec-area { position: relative; display: block; width: fit-content; max-width: 100%; margin: 10px auto 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; border: 1px solid var(--border); background: #fff; overflow: hidden; }
  .rec-area canvas { display: block; max-width: 100%; height: auto; max-height: 62vh; width: auto; }
  .rec-sel { position: absolute; border: 2px solid var(--gold); background: rgba(216,167,106,.15); box-shadow: 0 0 0 9999px rgba(0,0,0,.4); pointer-events: none; }
  .rec-status { font-size: 13px; color: var(--text-secondary); margin: 8px 0 0; min-height: 18px; }

  /* Finalizados em verde */
  .coluna-fim .coluna-qtd { background: var(--ok-bg); color: var(--ok-tx); }
  .coluna-fim .pasta { border-color: var(--m-recebido); background: var(--ok-bg); }
  .coluna-fim .pasta svg { color: var(--m-recebido) !important; }
  .coluna-fim .pasta-txt b { color: var(--ok-tx); }
  .coluna-fim .lista-fim { border-color: color-mix(in srgb, var(--m-recebido) 45%, var(--border)); }
  .coluna-fim .lista-fim button { border-left: 3px solid var(--m-recebido); }
  .coluna-fim .lista-fim .dt { color: var(--ok-tx); font-weight: 600; }

  /* Pasta Finalizados */
  .pasta { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-elevated-2); color: var(--text); text-align: left; cursor: pointer; }
  .pasta:hover { border-color: var(--gold-soft); }
  .pasta svg { flex: none; }
  .pasta-txt { flex: 1; min-width: 0; }
  .pasta-txt b { display: block; font-size: 14px; }
  .pasta-txt span { display: block; font-size: 12px; color: var(--text-secondary); }
  .mes { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-secondary); padding: 8px 4px 2px; }
  button.mes { width: 100%; border: 0; background: none; cursor: pointer; font-family: inherit; }
  button.mes:hover { color: var(--gold); }
  .lista-fim { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-elevated-2); }
  .lista-fim button { display: flex; align-items: center; gap: 8px; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: none; color: var(--text); padding: 8px 10px; cursor: pointer; font-size: 13px; }
  .lista-fim button:last-child { border-bottom: 0; }
  .lista-fim button:hover { color: var(--gold); }
  .lista-fim img, .lista-fim .mini-sem { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; flex: none; background: var(--neutro-bg); }
  .lista-fim .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lista-fim .nm small { display: block; color: var(--text-secondary); font-size: 11.5px; }
  .lista-fim .dt { font-size: 11.5px; color: var(--text-muted); flex: none; }
  .busca.pequena { height: 36px; min-width: 0; }

  /* Seletor de coluna no celular */
  .seletor-col { display: none; }

  /* ============================================================
     CARTÃO ABERTO
     ============================================================ */
  .modal.cartao { max-width: 900px; padding: 0; display: flex; flex-direction: column; max-height: 92vh; min-height: min(640px, 92vh); overflow: hidden; }
  .modal.cartao.novo { min-height: 0; }
  .modal.cartao.novo { max-width: 620px; }
  .c-cabeca { display: flex; gap: 16px; align-items: center; padding: 22px 60px 14px 24px; border-bottom: 1px solid var(--border); }
  .c-foto { width: 76px; height: 76px; flex: none; border-radius: 12px; overflow: hidden; border: 0; padding: 0; background: var(--neutro-bg); color: var(--text-muted); display: grid; place-items: center; cursor: zoom-in; }
  .c-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .c-tit { flex: 1; min-width: 0; }
  .c-tit h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; color: var(--text); }
  .c-tit p { margin: 4px 0 0; font-size: 14px; color: var(--text-secondary); }
  .c-lado { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
  .c-semana { font-size: 13px; font-weight: 700; background: var(--neutro-bg); border-radius: 8px; padding: 5px 10px; color: var(--text); }
  .c-semana.vermelho { background: var(--danger); color: #fff; }
  .c-semana.ambar { background: var(--alerta-ambar-bg); color: var(--alerta-ambar-tx); }
  .mover { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .mover select { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; min-height: 34px; }
  .fechar { position: absolute; top: 10px; right: 12px; width: 40px; height: 40px; border: 0; background: none; color: var(--text-muted); font-size: 20px; cursor: pointer; border-radius: 8px; }
  .fechar:hover { color: var(--gold); }
  .abas { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; }
  .abas button { border: 0; background: none; padding: 0 12px; height: 46px; font-size: 14px; font-weight: 600; color: var(--text-secondary); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  .abas button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--gold); }
  .abas .qtd { display: inline-block; min-width: 18px; margin-left: 4px; border-radius: 999px; font-size: 11px; line-height: 18px; background: var(--danger); color: #fff; }
  .c-corpo { padding: 18px 24px 24px; overflow-y: auto; flex: 1; min-height: 0; }

  .faixa { border-radius: 10px; padding: 11px 14px; font-size: 13.5px; font-weight: 600; margin-bottom: 14px; }
  .faixa.vermelho { background: var(--alerta-vermelho-bg); color: var(--alerta-vermelho-tx); }
  .faixa.ambar { background: var(--alerta-ambar-bg); color: var(--alerta-ambar-tx); }
  .faixa.ok { background: var(--ok-bg); color: var(--ok-tx); }
  .faixa.neutro { background: var(--neutro-bg); color: var(--text-secondary); font-weight: 500; }

  /* Materiais */
  .mat { position: relative; border: 1px solid var(--border); border-radius: 12px; padding: 12px 50px 12px 14px; margin-bottom: 10px; background: var(--bg-elevated-2); }
  .mat-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mat-nome { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; }
  .mat-nome input { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; color: var(--text); font: inherit; font-size: 15px; font-weight: 600; }
  .mat-nome input:hover, .mat-nome input:focus { border-color: var(--border); outline: none; background: var(--bg); }
  .mat-tipo { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
  .estados { display: flex; gap: 6px; flex-wrap: wrap; }
  .estados button { min-height: 42px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .estados button:hover { border-color: var(--gold-soft); color: var(--text); }
  .estados button[aria-pressed="true"].e-tenho { background: var(--m-tenho); border-color: var(--m-tenho); color: #fff; }
  .estados button[aria-pressed="true"].e-comprar { background: var(--m-comprar); border-color: var(--m-comprar); color: #fff; }
  .estados button[aria-pressed="true"].e-comprado { background: transparent; border: 2px solid var(--m-comprado); color: var(--m-comprado); }
  .estados button[aria-pressed="true"].e-recebido { background: var(--m-recebido); border-color: var(--m-recebido); color: #fff; }
  .estados button[aria-pressed="true"] .bol { display: none; }
  .mat-datas { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
  .mat-remover { position: absolute; top: 8px; right: 8px; border: 0; background: none; color: var(--text-muted); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .mat-remover:hover { color: var(--danger); }
  .novo-mat { border: 1px dashed var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .novo-mat .linha { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .novo-mat input[type="text"] { flex: 1; min-width: 180px; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 10px; font: inherit; font-size: 14px; }
  .pilulas { display: flex; gap: 6px; flex-wrap: wrap; }
  .pilulas button { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; }
  .pilulas button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .nota { font-size: 12.5px; color: var(--text-muted); margin-top: 10px; }

  /* Etapas */

    Object.keys(patch).forEach(k => { p[k] = patch[k] === APAGAR ? FV.delete() : limpo(patch[k]); });
    p.updatedAt = FV.serverTimestamp();
    return p;
  };
  store = {
    ouvir(cb, erro) { db.collection(COLLECTION).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), erro); },
    criar(dados) { const p = preparar(dados); p.createdAt = FV.serverTimestamp(); return db.collection(COLLECTION).add(p); },
    atualizar(id, patch) { return db.collection(COLLECTION).doc(id).update(preparar(patch)); },
    excluir(id) { return db.collection(COLLECTION).doc(id).delete(); },
    ouvirConfig(cb) { db.collection(CONFIG_COLLECTION).doc("alertas").onSnapshot(d => cb(d.exists ? d.data() : {}), () => cb({})); },
    salvarConfig(c) { return db.collection(CONFIG_COLLECTION).doc("alertas").set(c, { merge: true }); }
  };
} else {
  let mem = (window.SV_DADOS_DEMO || []).map(c => JSON.parse(JSON.stringify(c)));
  let ouvinte = null, ouvinteCfg = null, memCfg = {};
  const avisar = () => setTimeout(() => ouvinte && ouvinte(mem.map(c => JSON.parse(JSON.stringify(c)))), 0);
  store = {
    ouvir(cb) { ouvinte = cb; avisar(); },
    criar(dados) { const c = limpo(dados); c.id = "d" + novoId(); c.createdAt = new Date().toISOString(); mem.push(c); avisar(); return Promise.resolve(); },
    atualizar(id, patch) {
      const c = mem.find(x => x.id === id); if (!c) return Promise.resolve();
      Object.keys(patch).forEach(k => { if (patch[k] === APAGAR) delete c[k]; else c[k] = limpo(patch[k]); });
      avisar(); return Promise.resolve();
    },
    excluir(id) { mem = mem.filter(x => x.id !== id); avisar(); return Promise.resolve(); },
    ouvirConfig(cb) { ouvinteCfg = cb; cb(memCfg); },
    salvarConfig(c) { memCfg = { ...memCfg, ...c }; ouvinteCfg && ouvinteCfg(memCfg); return Promise.resolve(); }
  };
}

/* ============================================================
   LEITURA DE CADA ENCOMENDA (cálculos)
   ============================================================ */
function statusDe(c) { return [APROV, AFAZER, PRONTA, PRE, EXEC, FIM].includes(c.status) ? c.status : APROV; }
function arquivosDe(c) {
  return c.files
    || (c.photos ? c.photos.map(p => ({ name: "foto.jpg", type: "image", data: p })) : null)
    || (c.photoUrl ? [{ name: "foto.jpg", type: "image", data: c.photoUrl }] : []);
}
function fotoDe(c) { const f = arquivosDe(c).find(x => x.type === "image"); return f ? f.data : null; }
function contratoDe(c) { return arquivosDe(c).find(x => x.type === "pdf") || null; }
function temContrato(c) { return !!contratoDe(c) || (DEMO && !!c.demoContrato); }
function projetoFeito(c) { return c.projeto3d ? !!c.projeto3d.feito : c.tipo !== "personalizado"; }
function etapasDe(c) { return c.etapas || {}; }
function pronto(m) { return m.status === "tenho" || m.status === "recebido"; }

function info(c) {
  const t = hoje();
  const st = statusDe(c);
  const mats = c.materiais || [];
  const inicioReal = c.inicio && c.inicio.d ? c.inicio.d : null;
  const inicio = inicioReal || (c.dueDate ? addDias(c.dueDate, -30) : null);
  const ativo = st !== APROV && st !== FIM;
  const diasRest = c.dueDate ? dias(t, c.dueDate) : null;
  const prazoTotal = c.dueDate && inicio ? dias(inicio, c.dueDate) : null;
  const curto = prazoTotal != null && prazoTotal < cfg.limiteCurto;
  const avisoDias = curto ? cfg.avisoCurto : cfg.avisoLongo;
  const proj = projetoFeito(c);
  const prontos = mats.filter(pronto).length;
  const matsOk = mats.length > 0 && prontos === mats.length;
  const tudoPronto = proj && matsOk;
  const aComprar = mats.filter(m => m.status === "comprar");
  const aCaminho = mats.filter(m => m.status === "comprado");
  const limiteCompra = inicioReal ? addDias(inicioReal, cfg.diasCompra) : null;
  const compraAtrasada = ativo && !!limiteCompra && aComprar.length > 0 && t > limiteCompra;
  const vencida = ativo && diasRest != null && diasRest < 0;
  const apertando = ativo && !!inicioReal && st === AFAZER && !tudoPronto && diasRest != null && diasRest >= 0 && diasRest <= avisoDias;
  let semana = null;
  if (inicio && ativo) semana = Math.max(1, Math.floor(dias(inicio, t) / 7) + 1);
  const falta = [];
  if (!proj) falta.push("projeto 3D");
  if (mats.length === 0) falta.push("lista de materiais");
  else if (prontos < mats.length) falta.push((mats.length - prontos) + (mats.length - prontos === 1 ? " material" : " materiais"));
  const esperandoDesde = st === PRONTA ? ((c.prontaEm && c.prontaEm.d) || deTimestamp(c.updatedAt)) : null;
  return { st, mats, inicio, inicioReal, ativo, diasRest, prazoTotal, curto, avisoDias, proj, prontos, matsOk, tudoPronto, aComprar, aCaminho, limiteCompra, compraAtrasada, vencida, apertando, semana, falta, esperandoDesde };
}

/* Média de dias de chegada por tipo de material (da compra até a chegada) */
function mediasChegada() {
  const g = {};
  cards.forEach(c => (c.materiais || []).forEach(m => {
    const dc = m.datas && m.datas.comprado && m.datas.comprado.d;
    const dr = m.datas && m.datas.recebido && m.datas.recebido.d;
    if (!dc || !dr) return;
    const n = dias(dc, dr); if (n < 0) return;
    const k = m.tipo || "outro";
    (g[k] = g[k] || []).push(n);
  }));
  const r = {};
  Object.keys(g).forEach(k => { const l = g[k]; r[k] = { media: l.reduce((a, b) => a + b, 0) / l.length, n: l.length, max: Math.max(...l) }; });
  return r;
}

const ROTULO_MARCO = {

  pronta: "Pronta para produção", producao: "Joia em produção", finalizada: "Joia finalizada", enviada: "Joia enviada", semanal: "Contato da semana"
};
const SEMANAL = {
  1: "Contato da semana 1: os materiais estão sendo providenciados.",
  2: "Contato da semana 2: atualize sobre a chegada dos materiais.",
  3: "Contato da semana 3: explique que os 30 dias servem para a organização e que a confecção leva de 3 a 4 dias.",
  4: "Contato da semana 4: atualize sobre a produção e o envio."
};
function maxData(lista) { const l = lista.filter(Boolean).sort(); return l.length ? l[l.length - 1] : null; }
function marcos(c) {
  const r = [];
  const mats = c.materiais || [];
  const dt = (m, k) => m.datas && m.datas[k] && m.datas[k].d;
  const et = etapasDe(c);
  if (c.inicio && c.inicio.d) r.push({ k: "inicio", d: c.inicio.d });
  const tenho = mats.filter(m => m.status === "tenho");
  if (tenho.length) r.push({ k: "tenho", d: maxData(tenho.map(m => dt(m, "tenho"))) || (c.inicio && c.inicio.d) });
  if (mats.length && mats.every(m => m.status !== "comprar") && mats.some(m => m.status !== "tenho"))
    r.push({ k: "comprados", d: maxData(mats.map(m => dt(m, "comprado") || dt(m, "recebido") || dt(m, "tenho"))) });
  if (mats.length && mats.every(pronto) && mats.some(m => m.status === "recebido"))
    r.push({ k: "recebidos", d: maxData(mats.map(m => dt(m, "recebido") || dt(m, "tenho"))) });
  if (c.prontaEm && c.prontaEm.d) r.push({ k: "pronta", d: c.prontaEm.d });
  if (et.preInicio) r.push({ k: "producao", d: et.preInicio.d });
  if (et.prodFim) r.push({ k: "finalizada", d: et.prodFim.d });
  if (et.enviada) r.push({ k: "enviada", d: et.enviada.d });
  return r;
}
function avisoPendente(c) {
  const i = info(c);
  const st = i.st;
  const et = etapasDe(c);
  if (st === APROV) return null;
  if (st === FIM && !et.enviada) return null;
  const avisos = c.avisos || [];
  const feitos = new Set(avisos.map(a => a.k));
  const ms = marcos(c).filter(m => m.k !== "inicio");
  if (ms.length) {
    const ultimo = ms[ms.length - 1];
    if (!feitos.has(ultimo.k)) {
      let txt = MENSAGEM[ultimo.k];
      if (ultimo.k === "enviada" && c.rastreio) txt = "Joia enviada. Mande o código de rastreio: " + c.rastreio;
      return { k: ultimo.k, d: ultimo.d, txt };
    }
  }
  if (st === FIM || !i.inicioReal) return null;
  const ultimoContato = maxData(avisos.map(a => a.d)) || i.inicioReal;
  const semContato = dias(ultimoContato, hoje());
  if (semContato >= 7) {
    const s = Math.min(4, i.semana || 1);
    return { k: "semanal", d: hoje(), txt: SEMANAL[s] + " Faz " + semContato + " dias sem contato.", semanal: true };
  }
  return null;
}
function etapaCliente(c) {
  /* 0 materiais comprados · 1 recebidos · 2 pronta · 3 produção e envio */
  const ks = new Set(marcos(c).map(m => m.k));
  const feitos = [ks.has("comprados") || ks.has("recebidos"), ks.has("recebidos"), ks.has("pronta") || ks.has("producao"), ks.has("enviada")];
  return feitos;
}

let ultimoDesfazer = null;
function gravar(c, patch, msg, podeDesfazer = true) {
  const antes = {};
  Object.keys(patch).forEach(k => { antes[k] = c[k] === undefined ? APAGAR : limpo(c[k]); });
  return store.atualizar(c.id, patch).then(() => {
    if (msg) toast(msg, podeDesfazer ? () => store.atualizar(c.id, antes).then(() => toast("Desfeito")) : null);
  }).catch(err => { console.error(err); toast("Não consegui salvar, tente de novo"); });
}

/* Monta o que muda quando o cartão troca de coluna (datas automáticas) */
function patchMover(c, novo, base) {
  const p = base || {};
  const de = statusDe(c);
  if (de === novo) return p;
  const t = hoje();
  p.status = novo;
  p.movimentos = [...(c.movimentos || []), { d: t, de, para: novo }];
  if (de === APROV && novo !== APROV && !(c.inicio && c.inicio.d)) {
    p.inicio = { d: t };
    if (!c.dueDate) p.dueDate = addDias(t, 30);
  }
  const et = { ...etapasDe(c), ...(p.etapas || {}) };
  let mudouEt = false;
  if (novo === PRONTA && !(c.prontaEm && c.prontaEm.d) && !p.prontaEm) p.prontaEm = { d: t };
  if ((novo === PRE || novo === EXEC) && !et.preInicio) { et.preInicio = { d: t }; mudouEt = true; }
  if (novo === EXEC && !et.preFim) { et.preFim = { d: t }; mudouEt = true; }
  if (mudouEt) p.etapas = et;
  if (novo === FIM && !(c.finalizadoEm && c.finalizadoEm.d)) p.finalizadoEm = { d: t };
  return p;
}
function moverCard(c, novo) {
  if (statusDe(c) === novo) return;
  const p = patchMover(c, novo);
  let msg = "Movido para " + NOME_COLUNA[novo];
  if (p.dueDate) msg += ". Entrega em " + dm(p.dueDate) + " (30 dias)";
  if (novo === AFAZER) { const extra = verificarPronta(c, p); if (extra) msg = extra; }
  gravar(c, p, msg);
}

/* Depois de mexer em material ou projeto: o cartão vai sozinho para "Pronta" (ou volta para "A fazer") */
function verificarPronta(c, p) {
  const sim = { ...c };
  Object.keys(p).forEach(k => { if (p[k] === APAGAR) delete sim[k]; else sim[k] = p[k]; });
  const i = info(sim);
  if (i.st === AFAZER && i.tudoPronto) { patchMover(sim, PRONTA, p); return "Tudo pronto! A joia foi para Pronta para pré-produção"; }
  if (i.st === PRONTA && !i.tudoPronto) { patchMover(sim, AFAZER, p); return "A joia voltou para A fazer"; }
  return null;
}

function datasParaStatus(m, novo) {
  const t = hoje();
  const d = m.datas || {};
  if (novo === "tenho") return { tenho: d.tenho || { d: t } };
  const r = { comprar: d.comprar || { d: t } };
  if (novo === "comprado") r.comprado = d.comprado || { d: t };
  if (novo === "recebido") { if (d.comprado) r.comprado = d.comprado; r.recebido = d.recebido || { d: t }; }
  return r;
}
function mudarMaterial(c, idx, novo, viaBolinha) {
  const mats = limpo(c.materiais || []);
  const m = mats[idx]; if (!m || m.status === novo) return;
  m.datas = datasParaStatus(m, novo);
  m.status = novo;
  const p = { materiais: mats };
  const extra = verificarPronta(c, p);
  let msg = m.nome + ": " + MAT[novo].rot.toLowerCase() + " em " + dm(hoje());
  if (extra) msg = extra;
  gravar(c, p, msg);
}
function avancarBolinha(c, idx) {
  const m = (c.materiais || [])[idx]; if (!m) return;
  const prox = { comprar: "comprado", comprado: "recebido" }[m.status];
  if (!prox) { toast(m.nome + ": " + MAT[m.status].rot + ". Para mudar, abra o cartão."); return; }
  mudarMaterial(c, idx, prox, true);
}

const toastEl = document.getElementById("toast");
let toastTimer = null;
function toast(msg, desfazer) {
  toastEl.innerHTML = "<span>" + esc(msg) + "</span>" + (desfazer ? '<button type="button">Desfazer</button>' : "");
  if (desfazer) toastEl.querySelector("button").onclick = () => { toastEl.classList.remove("show"); desfazer(); };
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), desfazer ? 6000 : 2600);
}
function confirmar(msg, sim) {
  return new Promise(resolve => {
    const ov = document.getElementById("confirmaOverlay");
    document.getElementById("confirmaTxt").textContent = msg;
    const bSim = document.getElementById("confirmaSim"), bNao = document.getElementById("confirmaNao");
    bSim.textContent = sim || "Confirmar";
    const fim = v => { ov.classList.add("hidden"); bSim.onclick = bNao.onclick = ov.onclick = null; resolve(v); };
    bSim.onclick = () => fim(true);
    bNao.onclick = () => fim(false);
    ov.onclick = e => { if (e.target === ov) fim(false); };
    ov.classList.remove("hidden");
    bSim.focus();
  });
}
function abrirLightbox(src) { document.getElementById("lightbox-img").src = src; document.getElementById("lightbox").classList.add("aberto"); }
function fecharLightbox() { document.getElementById("lightbox").classList.remove("aberto"); }
function abrirPdf(dataUri) {
  try {
    const bin = atob(dataUri.split(",")[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { console.error(e); toast("Não consegui abrir esse PDF."); }
}

function desenharArquivos() {
  const g = document.getElementById("gradeArquivos"); if (!g) return;
  g.innerHTML = "";
  ui.arquivos.forEach((item, idx) => {
    const d = document.createElement("div");

      ? '<img src="' + item.data + '" alt="">'
      : '<div class="pdf-thumb" role="button" tabindex="0"><span class="pdf-label">PDF</span><span class="pdf-name">' + esc(item.name) + "</span></div>";
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "remove-photo"; rm.title = "Remover"; rm.setAttribute("aria-label", "Remover " + (item.name || "arquivo")); rm.textContent = "×";
    rm.onclick = e => { e.stopPropagation(); ui.arquivos.splice(idx, 1); ui.detSujo = true; desenharArquivos(); };
    d.appendChild(rm);

function ligarDetalhes() {
  desenharArquivos();
  modal.querySelectorAll(".c-corpo input, .c-corpo textarea").forEach(el => el.addEventListener("input", () => { ui.detSujo = true; }));
  modal.querySelectorAll('input[name="fTipo"]').forEach(el => el.addEventListener("change", () => { ui.detSujo = true; }));
  const inp = document.getElementById("fArquivo");
  inp.addEventListener("change", async () => { await adicionarArquivos(Array.from(inp.files || [])); inp.value = ""; });
}
async function adicionarArquivos(files) {
  const st = document.getElementById("statusUpload");
  for (const file of files) {
    const img = file.type.startsWith("image/"), pdf = file.type === "application/pdf";
    try {
      let data;
      if (img) { st.textContent = "Processando " + file.name + "..."; data = await compressImage(file); }
      else if (pdf) { st.textContent = "Comprimindo " + file.name + "..."; data = await compressPdfFile(file, st); }
      else { data = await readFileAsDataURL(file); }
      ui.arquivos.push({ name: file.name || "foto.jpg", type: img ? "image" : "pdf", data });
      ui.detSujo = true;
      desenharArquivos();
    } catch (e) { console.error(e); toast("Não consegui processar " + file.name); }
  }
  if (st) st.textContent = "Anexo(s) prontos. Clique em Salvar para confirmar.";
}
document.addEventListener("paste", e => {
  if (overlay.classList.contains("hidden") || ui.aba !== "det") return;
  const itens = Array.from((e.clipboardData && e.clipboardData.items) || []).filter(it => it.type.startsWith("image/"));
  if (!itens.length) return;
  e.preventDefault();
  adicionarArquivos(itens.map(it => { const f = it.getAsFile(); return new File([f], "foto-colada.png", { type: f.type }); }));
});
async function salvarDetalhes() {

  const dados = {

    '<div class="linha"><button type="button" class="btn btn-grande" data-acao="addMat" data-st="tenho">' + bolinha("tenho") + " Já tenho</button>" +

  return h;

  const p = { materiais: mats };
  const extra = verificarPronta(c, p);
  gravar(c, p, extra || (nome + " adicionado: " + MAT[status].rot.toLowerCase()));
}

/* ---------- Aba: Etapas da joia ---------- */
function htmlEtapas(c) {

  else proj = '<span class="val">Pendente</span><button type="button" class="btn btn-solid btn-grande" data-acao="proj" data-v="1">Marcar 3D finalizado</button>';

    '<div class="trilha"><span class="rotulo">Trilha 1 · Materiais (prazo de ' + cfg.diasCompra + ' dias)</span><span class="val">' +

    '<div class="trilha"><span class="rotulo">Trilha 2 · Projeto 3D (sem prazo fixo)</span><div class="linha">' + proj + "</div></div></div>";

  }
  const passo = (n, tit, desc, estado, acao) => '<div class="etapa ' + estado + '"><span class="num">' + (estado === "feita" ? ICONE_CHECK.replace("<svg", '<svg width="14" height="14"') : n) + '</span><div class="txt"><b>' + tit + "</b><span>" + desc + "</span></div>" + acao + "</div>";
  const feito = (m, txt) => '<span class="feito-em">' + txt + " " + dm(m.d) + "</span>";

  /* 1 · Pronta */
  const prontaD = c.prontaEm && c.prontaEm.d;
  h += passo(1, "Pronta para pré-produção", prontaD ? "Materiais e projeto 3D prontos." : (i.tudoPronto ? "Tudo pronto." : "Automático quando tudo estiver pronto. Falta: " + esc(i.falta.join(", ")) + "."),
    prontaD || i.tudoPronto ? "feita" : "", prontaD ? feito(c.prontaEm, "Em") : "");
  /* 2 · Pré-produção */
  let a2 = "", e2 = "";
  if (et.preFim) { e2 = "feita"; a2 = feito(et.preFim, "Concluída"); }
  else if (et.preInicio) { e2 = "agora"; a2 = '<span class="nota" style="margin:0">Iniciada ' + dm(et.preInicio.d) + '</span><button type="button" class="btn btn-solid btn-grande" data-acao="etapa" data-e="preFim">Concluir pré-produção</button>'; }
  else if (i.st !== APROV) { e2 = i.tudoPronto ? "agora" : ""; a2 = '<button type="button" class="btn ' + (i.tudoPronto ? "btn-solid " : "") + 'btn-grande" data-acao="etapa" data-e="preInicio">Iniciar pré-produção</button>'; }
  h += passo(2, "Pré-produção", "Impressão do protótipo na impressora 3D.", e2, a2);
  /* 3 · Produção */
  let a3 = "", e3 = "";
  if (et.prodFim) { e3 = "feita"; a3 = feito(et.prodFim, "Joia finalizada em"); }
  else if (et.preFim || i.st === EXEC) { e3 = "agora"; a3 = '<button type="button" class="btn btn-solid btn-grande" data-acao="etapa" data-e="prodFim">Concluir produção</button>'; }
  h += passo(3, "Produção", "Fundição, acabamento e o resto, geralmente em um dia.", e3, a3);
  /* 4 · Enviada */
  let a4 = "", e4 = "";
  if (et.enviada) { e4 = "feita"; a4 = feito(et.enviada, "Enviada") + (c.rastreio ? '<span class="nota" style="margin:0">Rastreio: ' + esc(c.rastreio) + "</span>" : ""); }
  else if (et.prodFim) { e4 = "agora"; a4 = '<input type="text" id="rastreio" placeholder="Código de rastreio" aria-label="Código de rastreio" value="' + esc(c.rastreio) + '"><button type="button" class="btn btn-solid btn-grande" data-acao="etapa" data-e="enviada">Marcar como enviada</button>'; }
  h += passo(4, "Pronta e enviada", "Com o código de rastreio. A encomenda vai para Finalizados.", e4, a4);
  h += '<p class="nota">Concluir a pré-produção leva o cartão para Em execução. Marcar como enviada leva para Finalizados. Da coluna Pronta para Pré-produção quem move é você, quando começar.</p>';
  return h;
}
async function concluirEtapa(c, e) {
  const t = hoje();
  const i = info(c);
  const et = { ...etapasDe(c) };
  let p = {}, msg = "";
  if (e === "preInicio") {
    if (!i.tudoPronto && !(await confirmar("Ainda falta: " + i.falta.join(", ") + ". Iniciar a pré-produção mesmo assim?", "Iniciar mesmo assim"))) return;
    et.preInicio = { d: t }; p.etapas = et; patchMover(c, PRE, p); msg = "Pré-produção iniciada";
  } else if (e === "preFim") {
    et.preFim = { d: t }; p.etapas = et; patchMover(c, EXEC, p); msg = "Pré-produção concluída. A joia foi para Em execução";
  } else if (e === "prodFim") {
    et.prodFim = { d: t }; p.etapas = et; if (statusDe(c) !== EXEC && statusDe(c) !== FIM) patchMover(c, EXEC, p); msg = "Produção concluída. Joia finalizada";
  } else if (e === "enviada") {
    const r = (document.getElementById("rastreio") || {}).value || "";
    if (!r.trim() && !(await confirmar("Marcar como enviada sem o código de rastreio?", "Marcar sem código"))) return;
    et.enviada = { d: t }; p.etapas = et; p.rastreio = r.trim(); patchMover(c, FIM, p); msg = "Joia enviada e movida para Finalizados";
  }
  gravar(c, p, msg);
}

/* ---------- Aba: Histórico ---------- */
function eventos(c) {
  const ev = [];
  const add = (marco, txt, ref) => { if (marco && marco.d) ev.push({ d: marco.d, ed: !!marco.ed, txt, ref }); };
  const criado = deTimestamp(c.createdAt);
  if (criado) ev.push({ d: criado, txt: "Encomenda cadastrada", ref: null });
  add(c.inicio, "Saiu de Aprovação. Contagem do prazo iniciada.", { k: "inicio" });
  (c.movimentos || []).forEach((m, x) => { if (m.de !== APROV) add(m, "Movido de " + NOME_COLUNA[m.de] + " para " + NOME_COLUNA[m.para], { k: "mov", x }); });
  (c.materiais || []).forEach((m, x) => {
    const d = m.datas || {};
    add(d.tenho, m.nome + ": já tinha no atelier", { k: "mat", x, s: "tenho" });
    add(d.comprar, m.nome + ": precisa comprar", { k: "mat", x, s: "comprar" });
    add(d.comprado, m.nome + ": comprado", { k: "mat", x, s: "comprado" });
    add(d.recebido, m.nome + ": chegou" + (d.comprado ? " (" + dias(d.comprado.d, d.recebido.d) + " dias depois da compra)" : ""), { k: "mat", x, s: "recebido" });
  });
  if (c.projeto3d && c.projeto3d.d) add(c.projeto3d.d, "Projeto 3D finalizado", { k: "proj" });
  add(c.prontaEm, "Tudo pronto para a pré-produção", { k: "pronta" });
  const et = etapasDe(c);
  add(et.preInicio, "Pré-produção iniciada (protótipo)", { k: "et", e: "preInicio" });
  add(et.preFim, "Pré-produção concluída", { k: "et", e: "preFim" });
  add(et.prodFim, "Produção concluída, joia finalizada", { k: "et", e: "prodFim" });
  add(et.enviada, "Joia enviada" + (c.rastreio ? ". Rastreio: " + c.rastreio : ""), { k: "et", e: "enviada" });
  (c.avisos || []).forEach((a, x) => add(a, "Lohana avisou o cliente: " + (ROTULO_MARCO[a.k] || "contato").toLowerCase(), { k: "aviso", x }));
  const i = info(c);
  if (i.compraAtrasada) ev.push({ d: addDias(i.limiteCompra, 1), txt: "Prazo de compra venceu sem a compra marcada (" + i.aComprar.length + (i.aComprar.length === 1 ? " item" : " itens") + ")", ref: null, alerta: true });
  if (i.vencida) ev.push({ d: addDias(c.dueDate, 1), txt: "Data de entrega venceu", ref: null, alerta: true });
  return ev.sort((a, b) => a.d.localeCompare(b.d));
}
function htmlHistorico(c) {
  const i = info(c);
  const ev = eventos(c);
  let resumo = '<div class="hist-resumo">';
  if (i.inicio && c.dueDate) resumo += "<span>Prazo total <b>" + dias(i.inicio, c.dueDate) + " dias</b>" + (i.inicioReal ? "" : " (início estimado)") + "</span>";
  if (i.ativo && i.diasRest != null) resumo += "<span>" + (i.diasRest < 0 ? "Atrasada há <b>" + (-i.diasRest) + " dias</b>" : "Faltam <b>" + i.diasRest + " dias</b>") + "</span>";
  if (i.inicio && i.ativo) resumo += "<span>Hoje é o <b>dia " + Math.max(0, dias(i.inicio, hoje())) + "</b></span>";
  resumo += "</div>";
  if (!ev.length) return resumo + '<div class="faixa neutro">Nenhum registro ainda.</div>';
  const chave = r => r ? JSON.stringify(r) : "";
  return resumo + '<div class="hist">' + ev.map(e => {
    const editando = e.ref && ui.editandoData === chave(e.ref);
    return '<div class="hist-item"' + (e.alerta ? ' style="border-color:var(--m-comprar)"' : "") + '><span class="dt">' + dm(e.d) + '</span><span class="tx">' + esc(e.txt) + (e.ed ? '<span class="editado">editado</span>' : "") + "</span>" +
      (editando ? '<input type="date" id="editData" value="' + e.d + '" aria-label="Nova data"><button type="button" class="btn btn-solid" data-acao="salvarData" data-ref=\'' + esc(chave(e.ref)) + "'>OK</button>"
        : e.ref ? '<button type="button" class="lapis" data-acao="editarData" data-ref=\'' + esc(chave(e.ref)) + '\' aria-label="Corrigir a data de: ' + esc(e.txt) + '" title="Corrigir a data">' + ICONE_LAPIS + "</button>" : "") + "</div>";
  }).join("") + '</div><p class="nota">Esqueceu de marcar no dia? Use o lápis para corrigir. A data corrigida fica marcada como "editado".</p>';
}
function salvarData(c, refTxt, novaData) {
  if (!novaData) return;
  const ref = JSON.parse(refTxt);
  const marco = { d: novaData, ed: true };
  let p = {};
  if (ref.k === "inicio") p.inicio = marco;
  else if (ref.k === "pronta") p.prontaEm = marco;
  else if (ref.k === "proj") p.projeto3d = { ...(c.projeto3d || {}), d: marco };
  else if (ref.k === "mov") { const l = limpo(c.movimentos || []); l[ref.x] = { ...l[ref.x], ...marco }; p.movimentos = l; }
  else if (ref.k === "aviso") { const l = limpo(c.avisos || []); l[ref.x] = { ...l[ref.x], ...marco }; p.avisos = l; }
  else if (ref.k === "et") { const et = limpo(etapasDe(c)); et[ref.e] = marco; p.etapas = et; }
  else if (ref.k === "mat") { const l = limpo(c.materiais || []); l[ref.x].datas = { ...(l[ref.x].datas || {}), [ref.s]: marco }; p.materiais = l; }
  ui.editandoData = null;
  gravar(c, p, "Data corrigida para " + dm(novaData));
}

document.addEventListener("click", async e => {
  const alvo = e.target.closest("[data-acao],[data-filtro],[data-visao],[data-ir],[data-colcel],[data-aba],[data-sugestao],[data-novotipo],[data-fechar-ajustes]");

  }
  const d = alvo.dataset;
  if (d.fecharAjustes !== undefined) { document.getElementById("ajustesOverlay").classList.add("hidden"); return; }
  if (d.visao) { ui.visao = d.visao; ui.filtro = ""; desenhar(); window.scrollTo(0, 0); return; }
  if (d.ir) { ui.visao = d.ir; desenhar(); window.scrollTo(0, 0); return; }
  if (d.filtro !== undefined) { ui.filtro = ui.filtro === d.filtro ? "" : d.filtro; desenhar(); return; }
  if (d.colcel) { ui.colCelular = d.colcel; desenhar(); return; }
  if (d.sugestao) { const el = document.getElementById("novoMatNome"); el.value = d.sugestao; ui.novoMatTipo = d.tipo; modal.querySelectorAll("[data-novotipo]").forEach(b => b.setAttribute("aria-pressed", b.dataset.novotipo === d.tipo)); el.focus(); return; }
  if (d.novotipo) { ui.novoMatTipo = d.novotipo; modal.querySelectorAll("[data-novotipo]").forEach(b => b.setAttribute("aria-pressed", b.dataset.novotipo === d.novotipo)); return; }
  if (d.aba && !d.acao) {
    if (ui.detSujo && ui.aba === "det" && d.aba !== "det" && !(await confirmar("Sair dos detalhes sem salvar as alterações?", "Sair sem salvar"))) return;
    if (d.aba !== "det") ui.detSujo = false;
    if (!overlay.classList.contains("hidden")) { const c = cardAberto(); ui.aba = d.aba; ui.editandoData = null; if (c && d.aba === "det") ui.arquivos = [...arquivosDe(c)]; desenharCartao(true); }
    return;
  }
  const c = cards.find(x => x.id === d.id) || cardAberto();
  switch (d.acao) {
    case "abrir": abrirCartao(d.id, d.aba); break;
    case "zoom": { const f = c && fotoDe(c); if (f) abrirLightbox(f); break; }
    case "pdf": { const p = c && contratoDe(c); if (p) abrirPdf(p.data); break; }
    case "bol": avancarBolinha(c, Number(d.i)); break;
    case "mat": mudarMaterial(c, Number(d.i), d.st); break;
    case "mes": { const el = alvo; ui.mesesAbertos[d.mes] = el.getAttribute("aria-expanded") !== "true"; desenhar(); break; }
    case "pasta": ui.pastaAberta = !ui.pastaAberta; if (!ui.pastaAberta) ui.buscaFim = ""; desenhar(); break;
    case "fechar": fecharCartao(); break;
    case "salvarDet": salvarDetalhes(); break;
    case "excluir":
      if (await confirmar("Excluir esta encomenda? Essa ação não pode ser desfeita.", "Excluir")) { store.excluir(c.id).then(() => { ui.detSujo = false; fecharCartao(true); toast("Encomenda excluída"); }); }
      break;
    case "addMat": adicionarMaterial(c, d.st); break;
    case "qa": ui.qa = d.id; ui.qaNome = ""; ui.qaTexto = ""; desenhar(); setTimeout(() => { const el = document.getElementById("qaTexto"); if (el && !window.matchMedia("(max-width: 760px)").matches) el.focus(); }, 0); break;
    case "qaFechar": ui.qa = null; ui.qaNome = ""; ui.qaTexto = ""; desenhar(); break;
    case "qaNome": ui.qaNome = d.nome; ui.qaTipo = d.tipo; ui.qaTexto = ""; desenhar(); break;
    case "qaAdd": {
      const nome = (ui.qaTexto || "").trim() || ui.qaNome;
      if (!nome) { toast("Escolha uma sugestão ou escreva o material"); break; }
      const tipo = (ui.qaTexto || "").trim() ? tipoPeloNome(nome) : ui.qaTipo;
      ui.qaNome = ""; ui.qaTexto = "";
      novoMaterial(c, nome, tipo, d.st);
      break;
    }
    case "recortar": abrirRecorte(c); break;
    case "remMat": {
      const m = (c.materiais || [])[Number(d.i)];
      if (m && (await confirmar("Remover " + m.nome + " da lista de materiais?", "Remover"))) { const l = limpo(c.materiais); l.splice(Number(d.i), 1); const p = { materiais: l }; const extra = verificarPronta(c, p); gravar(c, p, extra || m.nome + " removido"); }
      break;
    }
    case "proj": {
      const feito = d.v === "1";
      const p = { projeto3d: feito ? { feito: true, d: { d: hoje() } } : { feito: false } };
      const extra = verificarPronta(c, p);
      gravar(c, p, extra || (feito ? "Projeto 3D finalizado" : "Projeto 3D reaberto"));
      break;
    }
    case "etapa": concluirEtapa(c, d.e); break;
    case "editarData": ui.editandoData = d.ref; desenharCartao(false); break;
    case "salvarData": salvarData(c, d.ref, (document.getElementById("editData") || {}).value); break;
    case "avisado": {
      const a = avisoPendente(c); if (!a) break;
      gravar(c, { avisos: [...limpo(c.avisos || []), { d: hoje(), k: a.k }] }, "Contato registrado: " + c.client);
      break;
    }
  }
});

function carregarImagem(src) { return new Promise((ok, erro) => { const im = new Image(); im.onload = () => ok(im); im.onerror = erro; im.src = src; }); }
async function abrirRecorte(c) {
  const ov = document.getElementById("recorteOverlay");
  const st = document.getElementById("recStatus");

    else {
      if (!window.pdfjsLib) throw new Error("leitor de PDF não carregou");
      const pdf = contratoDe(c);
      const bin = atob(pdf.data.split(",")[1]);
      const bytes = new Uint8Array(bin.length);
      for (let x = 0; x < bin.length; x++) bytes[x] = bin.charCodeAt(x);
      const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
      for (let n = 1; n <= Math.min(doc.numPages, 8); n++) rec.paginas.push({ doc, n });
    }
    document.getElementById("recPaginas").innerHTML = rec.paginas.length > 1
      ? rec.paginas.map((_, x) => '<button type="button" data-pag="' + x + '" aria-pressed="' + (x === 0) + '">Página ' + (x + 1) + "</button>").join("") : "";
    await desenharPaginaRecorte();
  } catch (e) { console.error(e); st.textContent = "Não consegui abrir o contrato. Tente de novo ou anexe a foto direto."; }
}
async function desenharPaginaRecorte() {
  const cv = document.getElementById("recCanvas");
  const st = document.getElementById("recStatus");
  const item = rec.paginas[rec.atual];
  rec.sel = null; document.getElementById("recSel").hidden = true; document.getElementById("recUsar").disabled = true;
  st.textContent = "Carregando a página...";
  if (typeof item === "string") {
    const im = await carregarImagem(item);
    const w = 1200, h = Math.round(im.naturalHeight * w / im.naturalWidth);
    cv.width = w; cv.height = h; cv.getContext("2d").drawImage(im, 0, 0, w, h);
  } else {
    const page = await item.doc.getPage(item.n);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 1400 / base.width });
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
  }
  st.textContent = "Arraste sobre a foto da joia.";
}
function fecharRecorte() { document.getElementById("recorteOverlay").classList.add("hidden"); rec.paginas = []; }
(function ligarRecorte() {
  const area = document.getElementById("recArea"), sel = document.getElementById("recSel");
  const ponto = e => { const r = area.getBoundingClientRect(); return { x: Math.max(0, Math.min(r.width, e.clientX - r.left)), y: Math.max(0, Math.min(r.height, e.clientY - r.top)) }; };
  const mostrar = () => { const s = rec.sel; sel.hidden = !s; if (s) Object.assign(sel.style, { left: s.x + "px", top: s.y + "px", width: s.w + "px", height: s.h + "px" }); };
  area.addEventListener("pointerdown", e => { if (!rec.paginas.length) return; e.preventDefault(); area.setPointerCapture(e.pointerId); rec.inicio = ponto(e); rec.sel = { x: rec.inicio.x, y: rec.inicio.y, w: 0, h: 0 }; mostrar(); });
  area.addEventListener("pointermove", e => {
    if (!rec.inicio) return;
    const p = ponto(e), a = rec.inicio;
    rec.sel = { x: Math.min(a.x, p.x), y: Math.min(a.y, p.y), w: Math.abs(p.x - a.x), h: Math.abs(p.y - a.y) }; mostrar();
  });
  const soltar = () => {
    if (!rec.inicio) return; rec.inicio = null;
    const ok = rec.sel && rec.sel.w > 12 && rec.sel.h > 12;
    if (!ok) { rec.sel = null; mostrar(); }
    document.getElementById("recUsar").disabled = !ok;
    document.getElementById("recStatus").textContent = ok ? "Se ficou bom, toque em Usar este recorte. Para refazer, é só arrastar de novo." : "Arraste sobre a foto da joia.";
  };
  area.addEventListener("pointerup", soltar);
  area.addEventListener("pointercancel", soltar);
  document.getElementById("recPaginas").addEventListener("click", e => {
    const b = e.target.closest("[data-pag]"); if (!b) return;
    rec.atual = Number(b.dataset.pag);
    document.querySelectorAll("#recPaginas [data-pag]").forEach(x => x.setAttribute("aria-pressed", x === b));
    desenharPaginaRecorte();
  });
  document.getElementById("recCancelar").addEventListener("click", fecharRecorte);
  document.getElementById("recorteOverlay").addEventListener("click", e => { if (e.target.id === "recorteOverlay") fecharRecorte(); });
  document.getElementById("recUsar").addEventListener("click", () => {
    const cv = document.getElementById("recCanvas"); const s = rec.sel; if (!s) return;
    const k = cv.width / cv.getBoundingClientRect().width;
    const sx = s.x * k, sy = s.y * k, sw = s.w * k, sh = s.h * k;
    const esc2 = Math.min(1, 700 / sw);
    const out = document.createElement("canvas");
    out.width = Math.round(sw * esc2); out.height = Math.round(sh * esc2);
    out.getContext("2d").drawImage(cv, sx, sy, sw, sh, 0, 0, out.width, out.height);
    const data = out.toDataURL("image/jpeg", 0.75);
    fecharRecorte();
    if (overlay.classList.contains("hidden") || ui.abertoId !== rec.cardId || ui.aba !== "det") return;
    ui.arquivos = [{ name: "foto-do-contrato.jpg", type: "image", data }, ...ui.arquivos.filter(f => f.name !== "foto-do-contrato.jpg")];
    ui.detSujo = true;
    desenharArquivos();
    const stu = document.getElementById("statusUpload"); if (stu) stu.textContent = "Foto recortada do contrato. Clique em Salvar alterações para guardar.";
    toast("Foto pronta. Clique em Salvar alterações para guardar.");
  });
})();

/* ============================================================
   COMPRESSÃO DE FOTOS E PDF (igual à versão anterior)
   ============================================================ */
function compressImage(file, maxWidth = 700, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale; canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = e => resolve(e.target.result); r.onerror = reject; r.readAsDataURL(file); });
}
async function compressPDF(file, maxWidthPx = 1100, quality = 0.6) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const { jsPDF } = window.jspdf;
  let out = null;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const viewport = page.getViewport({ scale: Math.min(1, maxWidthPx / base.width) });
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(viewport.width); canvas.height = Math.round(viewport.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    const img = canvas.toDataURL("image/jpeg", quality);
    if (!out) out = new jsPDF({ unit: "px", format: [canvas.width, canvas.height] });
    else out.addPage([canvas.width, canvas.height]);
    out.addImage(img, "JPEG", 0, 0, canvas.width, canvas.height);
  }
  return out.output("datauristring").replace(/;filename=[^;]*/, "");
}
async function compressPdfFile(file, st) {
  const original = await readFileAsDataURL(file);
  if (!window.pdfjsLib || !window.jspdf) return original;
  try {
    const comp = await compressPDF(file);
    if (comp.length < original.length) { if (st) st.textContent = file.name + ": comprimido (~" + Math.round((1 - comp.length / original.length) * 100) + "% menor)"; return comp; }
    if (st) st.textContent = file.name + ": já estava leve, mantido original";
    return original;
  } catch (err) { console.error(err); if (st) st.textContent = file.name + ": não consegui comprimir, anexado original"; return original; }
}
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
